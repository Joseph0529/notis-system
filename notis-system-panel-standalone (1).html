<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>诺缇斯的系统</title>
<style>
  html,body{margin:0;padding:0;background:#0a0e16;}
</style>
</head>
<body>
<div id="app"></div>
<style>
  :root{
    --bg-deep:#0a0e16;
    --bg-panel:#111826;
    --bg-panel-2:#0d1420;
    --border:#22303f;
    --border-bright:#3a5468;
    --gold:#f0b64c;
    --gold-dim:#7a5c26;
    --cyan:#52d6c8;
    --cyan-dim:#1f4a48;
    --purple:#a78bfa;
    --purple-dim:#3d3564;
    --text:#e8ecf1;
    --text-dim:#8493a6;
    --danger:#e2574c;
    --success:#7ee0b0;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  #app{
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(240,182,76,0.35) 0, transparent 100%),
      radial-gradient(1px 1px at 70% 15%, rgba(82,214,200,0.3) 0, transparent 100%),
      radial-gradient(1px 1px at 40% 80%, rgba(240,182,76,0.25) 0, transparent 100%),
      radial-gradient(1px 1px at 85% 60%, rgba(82,214,200,0.25) 0, transparent 100%),
      radial-gradient(1px 1px at 55% 45%, rgba(240,182,76,0.2) 0, transparent 100%),
      radial-gradient(1px 1px at 25% 65%, rgba(167,139,250,0.2) 0, transparent 100%),
      linear-gradient(180deg, var(--bg-deep), #0c1119 60%, var(--bg-deep));
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:28px 18px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  .panel{
    position:relative;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--border);
    clip-path:polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    padding:20px 22px;
  }
  .panel::before{
    content:"";
    position:absolute;top:0;left:10px;right:10px;height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.6;
  }
  .panel.purple::before{background:linear-gradient(90deg, transparent, var(--purple), transparent);}

  .tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .tabbar button{padding:9px 16px;}
  .tabbar button.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--cyan);margin:0 0 6px;}
  h1{font-family:var(--sans);font-weight:800;letter-spacing:0.02em;font-size:26px;margin:0;color:var(--text);}
  h1 .accent{color:var(--gold);}
  h2{font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  h2::before{content:"◆";font-size:10px;color:var(--cyan);}
  h2.purple-h{color:var(--purple);}
  h2.purple-h::before{color:var(--purple);}
  .h2-sub{font-family:var(--mono);font-size:11px;color:var(--text-dim);font-weight:400;letter-spacing:0.02em;text-transform:none;margin-left:auto;}

  .header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
  .hud-portrait-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .hud-portrait-img{width:84px;height:84px;object-fit:cover;border:1px solid var(--border-bright);animation:portrait-glow 2.4s ease-in-out infinite;}
  .hud-portrait-placeholder{width:84px;height:84px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-family:var(--mono);font-size:9px;text-align:center;border:1px dashed var(--border-bright);padding:4px;}
  .hud-portrait-actions{display:flex;gap:4px;}
  .hud-portrait-actions button{padding:3px 7px;font-size:10px;}

  /* floating quick nav */
  .quick-nav{position:fixed;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:11px;z-index:50;}
  .qn-dot{width:10px;height:10px;padding:0;border-radius:50%;background:var(--bg-panel-2);border:1px solid var(--border-bright);position:relative;cursor:pointer;transition:all .2s ease;}
  .qn-dot.active{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(240,182,76,0.6);}
  .qn-label{position:absolute;right:16px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--mono);font-size:10px;color:var(--text-dim);background:var(--bg-panel);padding:2px 6px;border:1px solid var(--border);border-radius:2px;opacity:0;pointer-events:none;transition:opacity .15s ease;}
  .qn-dot:hover .qn-label, .qn-dot.active .qn-label{opacity:1;}
  @media (max-width:600px){.quick-nav{right:2px;gap:9px;}.qn-dot{width:8px;height:8px;}}
  .header-left{flex:1;min-width:220px;}
  .header-sub{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:6px;}
  .points-block{text-align:right;}
  .points-num{font-family:var(--mono);font-weight:700;font-size:40px;color:var(--gold);text-shadow:0 0 18px rgba(240,182,76,0.35);line-height:1;}
  .points-label{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px;}
  .points-controls{display:flex;gap:6px;margin-top:8px;justify-content:flex-end;}

  .grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:18px;}
  @media (max-width:820px){.grid{grid-template-columns:1fr;}}
  .stack{display:flex;flex-direction:column;gap:18px;}

  button{font-family:var(--mono);font-size:12px;letter-spacing:0.04em;background:var(--bg-panel-2);color:var(--cyan);border:1px solid var(--cyan-dim);padding:7px 12px;cursor:pointer;border-radius:2px;transition:all .15s ease;}
  button:hover{background:var(--cyan-dim);color:var(--text);border-color:var(--cyan);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.gold{color:var(--gold);border-color:var(--gold-dim);}
  button.gold:hover{background:var(--gold-dim);border-color:var(--gold);}
  button.purple{color:var(--purple);border-color:var(--purple-dim);}
  button.purple:hover{background:var(--purple-dim);border-color:var(--purple);}
  button.danger{color:var(--danger);border-color:#5c2a26;}
  button.danger:hover{background:#3a1a18;border-color:var(--danger);}
  button.ghost{background:transparent;border-color:var(--border);color:var(--text-dim);}
  button.small{padding:4px 8px;font-size:11px;}
  button.wide{width:100%;padding:10px;}

  input,select,textarea{font-family:var(--sans);font-size:13px;background:#0b1017;color:var(--text);border:1px solid var(--border);border-radius:2px;padding:7px 9px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);}
  label{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase;display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .check-row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin:8px 0;}
  .check-row input{width:auto;}

  .rank-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--bg-deep);background:var(--gold);padding:4px 12px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
  .rank-badge.small{font-size:11px;padding:2px 9px;}
  .char-detail{background:var(--bg-panel-2);border:1px solid var(--border);padding:18px 20px;clip-path:polygon(0 8px,8px 0,100% 0,100% 100%,0 100%);}
  .char-detail .char-name{font-size:17px;}
  .char-detail .top-line{margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .tier-badge{font-family:var(--mono);font-size:10px;color:var(--bg-deep);background:var(--cyan);padding:1px 7px;border-radius:2px;font-weight:700;}
  .tier-badge.forbidden{background:var(--purple);}

  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text-dim);}
  .kv .v{font-family:var(--mono);color:var(--text);}

  .poke-grid,.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .poke-card,.char-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:12px 14px;position:relative;clip-path:polygon(0 8px,8px 0,100% 0,100% 100%,0 100%);}
  .poke-sprite-wrap{width:100%;display:flex;justify-content:center;margin-bottom:6px;}
  .poke-sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;}
  .poke-modal-sprite-wrap{width:100%;display:flex;justify-content:center;margin:4px 0 12px;}
  .poke-modal-sprite{width:120px;height:120px;object-fit:contain;image-rendering:pixelated;animation:poke-idle-bounce 1.6s ease-in-out infinite;}
  @keyframes poke-idle-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .poke-card .top-line,.char-card .top-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .poke-name,.char-name{font-weight:700;font-size:14px;color:var(--text);}
  .poke-lv{font-family:var(--mono);font-size:12px;color:var(--gold);}
  .type-badges{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
  .type-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px;background:var(--cyan-dim);color:var(--cyan);letter-spacing:0.05em;}
  .poke-line,.char-line{font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .poke-line b,.char-line b{color:var(--text);font-weight:600;}
  .poke-actions,.char-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .poke-item-chip{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--gold-dim);padding:2px 8px;border-radius:2px;}

  .skill-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;background:var(--bg-panel-2);border:1px solid var(--border);padding:5px 9px;margin:0 6px 6px 0;}
  .skill-tag button{padding:0;border:none;background:none;color:var(--text-dim);font-size:13px;line-height:1;}
  .skill-tag button:hover{color:var(--danger);background:none;}

  /* skill proficiency cards */
  .skill-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:10px 12px;margin-bottom:8px;}
  .skill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px;}
  .skill-prof-outer{height:6px;background:#0b1017;border-radius:4px;overflow:hidden;margin-bottom:7px;}
  .skill-prof-inner{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));}
  .skill-actions-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .skill-prof-label{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-right:auto;}

  /* badge image */
  .badge-img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated;margin:0 auto;display:block;}

  .log-entry{font-family:var(--mono);font-size:12px;color:var(--text-dim);padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;}
  .log-entry .msg{color:var(--text);}
  .log-entry .tag{color:var(--gold);white-space:nowrap;}
  .log-empty,.poke-empty{color:var(--text-dim);font-size:12px;font-family:var(--mono);padding:10px 0;}

  .add-form{background:var(--bg-panel-2);border:1px solid var(--border-bright);padding:14px;margin-top:12px;}
  .form-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
  textarea{min-height:110px;resize:vertical;font-family:var(--sans);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-panel);border:1px solid var(--gold);color:var(--gold);font-family:var(--mono);font-size:13px;padding:10px 18px;opacity:0;pointer-events:none;transition:all .25s ease;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading-shell{color:var(--text-dim);font-family:var(--mono);padding:40px;text-align:center;}

  .bag-list{display:flex;flex-direction:column;gap:8px;}
  .bag-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg-panel-2);border:1px solid var(--border);padding:9px 12px;}
  .bag-item .bi-main{flex:1;min-width:0;}
  .bag-item .bi-name{font-size:13px;font-weight:600;color:var(--text);}
  .bag-item .bi-desc{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .bag-item .bi-qty{font-family:var(--mono);color:var(--gold);font-size:13px;min-width:36px;text-align:center;}
  .bag-item .bi-actions{display:flex;gap:4px;align-items:center;}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .form-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:11px 13px;position:relative;}
  .form-card.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim) inset;}
  .form-card .fc-name{font-weight:700;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;}
  .form-card .fc-active-tag{font-family:var(--mono);font-size:9px;color:var(--bg-deep);background:var(--gold);padding:1px 6px;letter-spacing:0.05em;}
  .form-card .fc-desc{font-size:12px;color:var(--text-dim);margin:6px 0 8px;line-height:1.5;}
  .form-card .fc-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .quest-list{display:flex;flex-direction:column;gap:8px;}
  .quest-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:11px 13px;}
  .quest-card.done{opacity:0.55;}
  .quest-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .quest-title{font-weight:700;font-size:13px;color:var(--text);}
  .quest-status{font-family:var(--mono);font-size:10px;padding:2px 8px;letter-spacing:0.05em;white-space:nowrap;}
  .quest-status.ongoing{color:var(--cyan);background:var(--cyan-dim);}
  .quest-status.done{color:var(--success);background:#173226;}
  .quest-desc{font-size:12px;color:var(--text-dim);margin:6px 0;line-height:1.5;}
  .quest-reward{font-family:var(--mono);font-size:11px;color:var(--gold);}
  .quest-actions{display:flex;gap:6px;margin-top:8px;}

  /* badges */
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .badge-chip{background:var(--bg-panel-2);border:1px solid var(--border);padding:12px;text-align:center;opacity:0.45;}
  .badge-chip.obtained{opacity:1;border-color:var(--gold);}
  .badge-icon{font-size:22px;color:var(--gold);}
  .badge-name{font-size:12px;margin-top:6px;color:var(--text);}
  .badge-actions{display:flex;gap:4px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
  .badge-icon-slot{width:40px;height:40px;margin:0 auto;display:flex;align-items:center;justify-content:center;}

  /* character pager */
  .char-pager-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .char-pager-nav button.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}
  .char-pager-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
  .char-pager-index{font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;}

  /* ultra form portrait */
  .portrait-wrap{width:100%;display:flex;justify-content:center;margin-bottom:14px;}
  .portrait-img{width:140px;height:140px;object-fit:cover;border:1px solid var(--border-bright);background:var(--bg-panel-2);animation:portrait-glow 2.4s ease-in-out infinite;}
  @keyframes portrait-glow{0%,100%{box-shadow:0 0 6px rgba(240,182,76,0.25);}50%{box-shadow:0 0 20px rgba(240,182,76,0.55);}}
  .portrait-actions{display:flex;gap:6px;justify-content:center;margin-bottom:14px;}

  /* villain dossier */
  .villain-card{background:var(--bg-panel-2);border:1px solid #5c2a26;padding:12px 14px;position:relative;clip-path:polygon(0 8px,8px 0,100% 0,100% 100%,0 100%);}
  .villain-sprite-wrap{width:100%;display:flex;justify-content:center;margin-bottom:6px;}
  .villain-sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;}
  .threat-badge{font-family:var(--mono);font-size:10px;color:var(--text);background:#5c2a26;padding:1px 7px;border-radius:2px;font-weight:700;}
  .threat-badge.high{background:var(--danger);color:var(--bg-deep);}

  /* affinity */
  .affinity-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .affinity-bar-outer{flex:1;min-width:160px;height:10px;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .affinity-bar-inner{height:100%;background:linear-gradient(90deg, var(--purple), var(--cyan));}
  .mood-tag{font-family:var(--mono);font-size:12px;color:var(--purple);border:1px solid var(--purple-dim);padding:3px 10px;border-radius:2px;white-space:nowrap;}
  .mood-flavor{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:8px;}

  /* AI shop */
  .shop-cat{margin-bottom:16px;}
  .shop-cat-title{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:0.08em;margin-bottom:8px;}
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .shop-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:11px 13px;}
  .shop-card .sc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .shop-card .sc-name{font-weight:700;font-size:13px;color:var(--text);}
  .shop-card .sc-price{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:nowrap;}
  .shop-card .sc-desc{font-size:12px;color:var(--text-dim);line-height:1.5;margin:6px 0 8px;}
  .shop-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .shop-hint{font-family:var(--mono);font-size:11px;color:var(--text-dim);}

  /* lottery */
  .mode-btns{display:flex;gap:8px;margin-bottom:12px;}
  .mode-btns button{flex:1;}
  .mode-btns button.active.normal{background:var(--cyan-dim);color:var(--cyan);border-color:var(--cyan);}
  .mode-btns button.active.blessing{background:var(--purple-dim);color:var(--purple);border-color:var(--purple);}
  .count-btns{display:flex;gap:8px;margin-bottom:14px;}
  .count-btns button{flex:1;}
  .count-btns button.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}
  .lottery-result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:12px;}
  .lottery-result{background:var(--bg-panel-2);border:1px solid var(--gold);padding:12px;text-align:center;clip-path:polygon(0 8px,8px 0,100% 0,100% 100%,0 100%,0 8px);}
  .lottery-result.epic{border-color:var(--purple);}
  .lottery-result .lr-type{font-family:var(--mono);font-size:9px;color:var(--cyan);letter-spacing:0.1em;text-transform:uppercase;}
  .lottery-result .lr-name{font-size:14px;font-weight:800;color:var(--gold);margin:5px 0;}
  .lottery-result .lr-desc{font-size:11px;color:var(--text-dim);line-height:1.4;}
  .lottery-flavor{font-family:var(--mono);font-size:12px;color:var(--purple);border-left:2px solid var(--purple-dim);padding:6px 10px;margin-bottom:10px;background:rgba(167,139,250,0.06);}

  .spin{display:inline-block;animation:spin 0.8s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .chat-log{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:4px 2px 8px;}
  .chat-msg{max-width:78%;padding:8px 12px;font-size:13px;line-height:1.55;}
  .chat-msg .cm-role{font-family:var(--mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:3px;opacity:0.7;}

  function readFileAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = ()=>resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  function resizeImageToDataURL(file, maxSize){
    // GIFs are read as-is so animated sprites keep animating; canvas re-encoding would flatten them to one frame.
    if(file.type === "image/gif"){ return readFileAsDataURL(file); }
    return new Promise((resolve, reject)=>{
      readFileAsDataURL(file).then(dataUrl=>{
        const img = new Image();
        img.onerror = reject;
        img.onload = ()=>{
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w*scale));
          h = Math.max(1, Math.round(h*scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = scale >= 1;
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/png"));
        };
        img.src = dataUrl;
      }).catch(reject);
    });
  }

  function calcRankFromLevel(lv){

  function migrate(loaded){

    // migrate skills from plain strings to {name,tier}
    if(Array.isArray(s.skills)){
      s.skills = s.skills.map(sk => typeof sk === "string" ? {name:sk, tier:"E", proficiency:50} : sk);
      s.skills = s.skills.map(sk => ({...sk, proficiency: typeof sk.proficiency === "number" ? clamp(sk.proficiency,0,100) : 50}));
    }
    if(Array.isArray(s.badges)){
      s.badges = s.badges.map(b => ({image:null, ...b}));
    }
    if(Array.isArray(s.team)){
      s.team = s.team.map(p => ({image:null, ...p}));
    }
    if(typeof s.storyContext !== "string" || !s.storyContext){ s.storyContext = DEFAULT_STATE.storyContext; }
    if(typeof s.ultraFormImage === "undefined") s.ultraFormImage = null;
    if(!Array.isArray(s.villains)) s.villains = structuredClone(DEFAULT_STATE.villains);
    if(typeof s.rankAutoSync !== "boolean") s.rankAutoSync = true;
    if(typeof s.systemAffinity !== "number") s.systemAffinity = 50;
    if(!Array.isArray(s.badges)) s.badges = structuredClone(DEFAULT_STATE.badges);
    if(!Array.isArray(s.characters)) s.characters = structuredClone(DEFAULT_STATE.characters);

      state = loaded ? migrate(loaded) : structuredClone(DEFAULT_STATE);
    }catch(e){
      state = structuredClone(DEFAULT_STATE);
    }
    try{
      const idx = await storage.get(SAVES_INDEX_KEY);
      saveSlots = idx && idx.value ? JSON.parse(idx.value) : [];

      saveSlots = [];

  function downloadJSON(filename, obj){
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  function showToast(msg){
    let t = document.querySelector(".toast");
    if(!t){ t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove("show"), 1800);
  }

  function burstParticlesAt(cx, cy, count){
    count = count || 16;
    for(let i=0;i<count;i++){
      const p = document.createElement("div");
      p.className = "particle";
      const angle = Math.random()*Math.PI*2;
      const dist = 50 + Math.random()*100;
      p.style.left = cx+"px"; p.style.top = cy+"px";
      p.style.setProperty("--dx", (Math.cos(angle)*dist)+"px");
      p.style.setProperty("--dy", (Math.sin(angle)*dist)+"px");
      p.style.background = Math.random()>0.5 ? "var(--gold)" : "var(--cyan)";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 900);
    }
  }
  function burstParticles(originEl, count){
    let cx = window.innerWidth/2, cy = window.innerHeight/2;
    if(originEl){ const rect = originEl.getBoundingClientRect(); cx = rect.left + rect.width/2; cy = rect.top + rect.height/2; }
    burstParticlesAt(cx, cy, count);
  }
  function triggerScreenFlash(color){
    const f = document.createElement("div");
    f.className = "screen-flash";
    f.style.background = `radial-gradient(circle, ${color||"rgba(240,182,76,0.35)"}, transparent 70%)`;
    document.body.appendChild(f);
    setTimeout(()=>f.remove(), 700);
  }

  let clickBound = false;
  function bindEvents(){
    const nameEl = app.querySelector('[data-field="ultraForm"]');
    if(nameEl){
      nameEl.addEventListener("blur", ()=>{ state.ultraForm = nameEl.textContent.trim() || state.ultraForm; persist(); render(); });
    }
    if(!clickBound){ app.addEventListener("click", onClick); clickBound = true; }

    if(sectionObserver) sectionObserver.disconnect();
    const sections = QUICK_NAV.map(s=>document.getElementById(s.id)).filter(Boolean);
    if(sections.length){
      sectionObserver = new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          const dot = document.querySelector(`.qn-dot[data-target="${entry.target.id}"]`);
          if(!dot) return;
          if(entry.isIntersecting) dot.classList.add("active");
          else dot.classList.remove("active");
        });
      }, {rootMargin:"-40% 0px -50% 0px", threshold:0});
      sections.forEach(el=>sectionObserver.observe(el));
    }

    const portraitFileInput = document.getElementById("portraitFileInput");
    if(portraitFileInput){
      portraitFileInput.addEventListener("change", async ()=>{
        const file = portraitFileInput.files && portraitFileInput.files[0];
        if(!file) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 260);
          state.ultraFormImage = dataUrl;
          persist("〔 叮!立绘已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
        portraitFileInput.value = "";
      });
    }

    const importJsonInput = document.getElementById("importJsonInput");
    if(importJsonInput){
      importJsonInput.addEventListener("change", ()=>{
        const file = importJsonInput.files && importJsonInput.files[0];
        if(file) importJsonFile(file);
        importJsonInput.value = "";
      });
    }

    app.querySelectorAll(".villain-file-input").forEach(inputEl=>{
      inputEl.addEventListener("change", async ()=>{
        const idx = parseInt(inputEl.dataset.idx);
        const file = inputEl.files && inputEl.files[0];
        if(!file || !state.villains[idx]) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 200);
          state.villains[idx].image = dataUrl;
          persist("〔 叮!强敌图片已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
      });
    });

    app.querySelectorAll(".poke-file-input").forEach(inputEl=>{
      inputEl.addEventListener("change", async ()=>{
        const idx = parseInt(inputEl.dataset.idx);
        const file = inputEl.files && inputEl.files[0];
        if(!file || !state.team[idx]) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 200);
          state.team[idx].image = dataUrl;
          persist("〔 叮!宝可梦图片已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
      });
    });

    app.querySelectorAll(".badge-file-input").forEach(inputEl=>{
      inputEl.addEventListener("change", async ()=>{
        const idx = parseInt(inputEl.dataset.idx);
        const file = inputEl.files && inputEl.files[0];
        if(!file) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 96);
          state.badges[idx].image = dataUrl;
          persist("〔 叮!徽章图片已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
      });
    });

    app.querySelectorAll(".skill-prof-range").forEach(rangeEl=>{
      rangeEl.addEventListener("input", ()=>{
        const idx = parseInt(rangeEl.dataset.idx);
        const label = document.getElementById(`skillProfLabel-${idx}`);
        if(label) label.textContent = `操纵度 ${rangeEl.value}%`;
        const bar = rangeEl.closest(".skill-card").querySelector(".skill-prof-inner");
        if(bar) bar.style.width = rangeEl.value+"%";
      });
      rangeEl.addEventListener("change", ()=>{
        const idx = parseInt(rangeEl.dataset.idx);
        state.skills[idx].proficiency = parseInt(rangeEl.value);
        persist();
      });
    });
    app.querySelectorAll(".skill-tier-select").forEach(sel=>{
      sel.addEventListener("change", ()=>{
        const idx = parseInt(sel.dataset.idx);
        state.skills[idx].tier = sel.value;
        persist("〔 叮!段位已更新 〕"); render();
      });
    });

    const newSkillInput = document.getElementById("newSkillInput");
    if(newSkillInput){
      newSkillInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); addSkillFromInputs(); } });
    }
    const chatInput = document.getElementById("chatInput");
    if(chatInput){
      chatInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendChatMessage(); } });
    }
    const chatLog = document.getElementById("chatLog");
    if(chatLog){ chatLog.scrollTop = chatLog.scrollHeight; }

    const rankAutoBox = document.getElementById("rankAutoSyncBox");
    if(rankAutoBox){
      rankAutoBox.addEventListener("change", ()=>{
        state.rankAutoSync = rankAutoBox.checked;
        if(state.rankAutoSync){ state.rank = calcRankFromLevel(state.level); }
        persist(); render();
      });
    }

    const modalBackdrop = app.querySelector(".modal-backdrop");
    if(modalBackdrop){
      modalBackdrop.addEventListener("click", (e)=>{ if(e.target === modalBackdrop){ activePokeModalIdx = null; render(); } });
    }

  function addBagItemByName(name, desc, qty){
    qty = qty || 1;

  // ---------- AI helpers ----------
  async function callClaude(messages, system){
    const body = { model: "claude-sonnet-4-6", max_tokens: 1200, messages };
    if(system) body.system = system;
    const response = await fetch(WORKER_URL, {
      method: "POST", headers: { "Content-Type": "application/json", "X-Access-Token": ACCESS_TOKEN }, body: JSON.stringify(body)
    });
    if(!response.ok){ throw new Error("后端请求失败 (HTTP " + response.status + ")"); }
    const data = await response.json();
    return (data.content||[]).map(b=>b.text||"").join("\n");
  }
  function extractJSON(text){
    const clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
    return JSON.parse(clean);
  }

  async function generateShop(){
    state.shopLoading = true; render();
    try{
      const prompt = `${personaBlock()}

你现在是"宝可梦系统"的AI商店模块,用上面那种推销员般自豪又带点跳脱的语气来包装商品描述。

${hostContextBlock()}

宿主最近向系统表达过的偏好:
${recentChatPreferences(6)}

请生成6件适合当前宿主购买的商店商品,必须严格分成三类,每类至少1-2件:

[{"name":"商品名称","category":"装备道具或技能卷轴或特殊道具","tier":"仅技能卷轴需要,否则留空字符串","price":数字,"desc":"20字以内的简短描述"}]`;

  function purchaseShopItem(idx, btn){
    const item = state.shopOffers[idx];
    if(!item) return;
    if(state.points < item.price){ showToast("〔 积分不足 〕"); return; }
    state.points -= item.price;
    if(item.category === "技能卷轴"){
      state.skills.push({name:item.name, tier: item.tier || "E", proficiency:10});
    }else{
      addBagItemByName(item.name, item.desc, 1);
    }
    state.shopOffers.splice(idx,1);
    addLog("商店购买", `购买了${item.name}(−${item.price}积分)`);
    bumpAffinity(3);
    if(btn) burstParticles(btn, 18);
    persist("〔 叮!购买成功 〕"); render();
  }

  async function drawLottery(btn){
    const totalCost = currentDrawTotalCost();
    if(state.points < totalCost){ showToast("〔 积分不足,无法抽奖 〕"); return; }
    const rect = btn ? btn.getBoundingClientRect() : null;
    const originX = rect ? rect.left + rect.width/2 : window.innerWidth/2;
    const originY = rect ? rect.top + rect.height/2 : window.innerHeight/2;
    const n = state.lotteryDrawCount||1;
    const mode = state.lotteryMode;
    state.lotteryLoading = true; render();
    try{
      const prompt = `${personaBlock()}

你现在是"宝可梦系统"的AI抽奖模块,播报结果时要有上面那种性格(比如中了好东西会像看到存钱罐满了一样雀跃,没中也可以带点气鼓鼓或者搞笑吐槽)。
当前宿主:${state.hostName}(${state.ultraForm}),段位${state.rank}级 LV${state.level}。

宿主最近向系统表达过的偏好:
${recentChatPreferences(6)}

本次抽奖模式:${mode==='blessing'?'祝福抽奖(高消耗,稀有度门槛更高,允许出现类似"破局关键"级别的传说奖励)':'普通抽奖(消耗较低,大多数是普通/稀有结果)'}
本次连抽次数:${n}

请一次性生成${n}条抽奖结果,每条结果类型可以是:道具(item)、技能(skill)、宝可梦(pokemon)、积分奖励(points)、或未中奖(nothing);稀有度字段rarity为:普通/稀有/史诗/传说 之一。${mode==='blessing'?'祝福模式下稀有度应明显高于普通模式,较大概率出现"稀有"以上,允许出现"传说"。':'普通模式下大多数应是"普通"或"稀有"。'}

只返回一个JSON数组,不要包含任何其他文字、解释或Markdown代码块符号,严格遵循以下格式(数组长度必须等于${n}):
[{"type":"item或skill或pokemon或points或nothing","name":"结果名称","rarity":"普通或稀有或史诗或传说","desc":"20字以内的播报描述","value":数字}]
(value仅在type为points时代表获得的积分数量,其他类型填0)`;
      const text = await callClaude([{ role: "user", content: prompt }]);
      let results = extractJSON(text);
      if(!Array.isArray(results)) results = [results];
      // pity: 10连抽保底至少一个史诗+
      if(n===10){
        const hasHigh = results.some(r=>r.rarity==="史诗"||r.rarity==="传说");
        if(!hasHigh && results.length){
          results[results.length-1] = {...results[results.length-1], rarity:"史诗", desc:(results[results.length-1].desc||"")+"(保底触发)"};
        }
      }
      state.points -= totalCost;
      results.forEach(applyLotteryResult);
      state.lastLotteryResults = results;
      addLog("抽奖", `${mode==='blessing'?'祝福':'普通'}抽奖${n}连,消耗${totalCost}积分`);
      bumpAffinity(2);
      persist("〔 叮!抽奖结果已揭晓 〕");
      const hasEpic = results.some(r=>r.rarity==="史诗"||r.rarity==="传说");
      burstParticlesAt(originX, originY, hasEpic ? 30 : 14);
      if(hasEpic) triggerScreenFlash("rgba(240,182,76,0.4)");
    }catch(e){ showToast("〔 抽奖连接失败,请重试 〕"); }
    state.lotteryLoading = false; render();
  }

  async function sendChatMessage(){
    const input = document.getElementById("chatInput");
    const msg = input.value.trim();
    if(!msg) return;
    state.chatHistory.push({role:"user", content: msg});
    state.chatLoading = true; input.value = ""; render();
    try{
      const system = `${personaBlock()}

请严格结合下方的剧情摘要与宿主状态来对话,涉及到的角色、地点、势力、法则/规则设定等都要与摘要保持一致,不要编造与摘要相悖的剧情或角色关系;摘要中没提到的细节可以合理发挥,但不能和已知设定冲突。
${hostContextBlock()}
宿主可能会告诉你他想要什么类型的道具、技能或宝可梦,请记住并回应这些偏好,这些内容之后会被系统的商店与抽奖模块参考。回复请简洁自然,控制在120字以内,不要输出JSON或代码块。`;
      const messages = state.chatHistory.map(m=>({role:m.role, content:m.content}));
      const reply = await callClaude(messages, system);
      state.chatHistory.push({role:"assistant", content: reply.trim() || "〔系统沉默了一下〕"});
      if(state.chatHistory.length > 60) state.chatHistory = state.chatHistory.slice(-60);
      bumpAffinity(1);
      persist();
    }catch(e){
      state.chatHistory.push({role:"assistant", content:"〔系统信号中断,请重试〕"});
      showToast("〔 与系统的连接中断了 〕");
    }
    state.chatLoading = false; render();
  }

  function applyLotteryResult(result){
    if(!result || !result.type) return;
    if(result.type === "skill"){
      state.skills.push({name:result.name, tier: result.rarity==="传说"?"SSS":(result.rarity==="史诗"?"SS":"D"), proficiency:10});
    }else if(result.type === "pokemon"){
      state.team.push({name:result.name, level:5, types:[], ability:"", hidden:"", moves:"", item:""});
    }else if(result.type === "points"){
      state.points += (result.value||0);
    }else if(result.type === "item"){
      addBagItemByName(result.name, result.desc, 1);
    }
  }

  load();
})();
</script>
</body>
</html>
