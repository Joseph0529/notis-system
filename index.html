<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>诺缇斯的系统</title>
<style>
  html,body{margin:0;padding:0;background:#070d12;overflow-x:hidden;}
  body{position:relative;}
  body::before{
    content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(52,214,160,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(52,214,160,0.05) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 20%, #000 0%, transparent 72%);
    animation:grid-drift 30s linear infinite;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 50% 30% at 15% 10%, rgba(52,214,160,0.07), transparent 60%),
      radial-gradient(ellipse 45% 30% at 90% 15%, rgba(229,72,77,0.06), transparent 60%),
      radial-gradient(ellipse 50% 35% at 50% 100%, rgba(74,168,255,0.06), transparent 60%);
    animation:glow-drift 16s ease-in-out infinite;
  }
  @keyframes grid-drift{from{transform:translate(0,0);}to{transform:translate(42px,42px);}}
  @keyframes glow-drift{0%,100%{opacity:0.8;transform:translateY(0);}50%{opacity:1;transform:translateY(-10px);}}
  .scan-sweep{position:fixed;left:0;right:0;top:0;height:2px;z-index:1;pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(52,214,160,0.75), transparent);
    box-shadow:0 0 16px rgba(52,214,160,0.65);
    animation:scan-sweep-move 7s linear infinite;}
  @keyframes scan-sweep-move{0%{top:0%;opacity:0;}5%{opacity:0.8;}95%{opacity:0.8;}100%{top:100%;opacity:0;}}
</style>
</head>
<body>
<div class="scan-sweep"></div>
<div id="app"></div>
<style>
  :root{
    --bg-deep:#070d12;
    --bg-panel:#0e1a20;
    --bg-panel-2:#0b161c;
    --bg-card:#16282f;
    --border:#1d383b;
    --border-bright:#24484a;
    --gold:#f0b64c;
    --gold-dim:#6e5424;
    --cyan:#34d6a0;
    --cyan-dim:#154236;
    --purple:#4aa8ff;
    --purple-dim:#183a5c;
    --silver:#b9c4d0;
    --red:#e5484d;
    --red-dim:#4a1c20;
    --ball:#ee3b33;
    --orange:#ff8a3d;
    --orange-dim:#5a2f14;
    --violet:#7c6cff;
    --crimson:#c2283b;
    --crimson-dim:#3a1218;
    --ghost:#8b3fd9;
    --bond:linear-gradient(90deg,#ff5a5f,#ff9f43,#ffd166,#5ee08a,#4dd8e8,#5b9dff,#a77bff);
    --text:#e8edf2;
    --text-dim:#8ba0aa;
    --danger:#ff4d4f;
    --success:#5ee08a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  #app{
    position:relative;z-index:2;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(52,214,160,0.35) 0, transparent 100%),
      radial-gradient(1px 1px at 70% 15%, rgba(240,182,76,0.25) 0, transparent 100%),
      radial-gradient(1px 1px at 40% 80%, rgba(240,182,76,0.25) 0, transparent 100%),
      radial-gradient(1px 1px at 85% 60%, rgba(74,168,255,0.28) 0, transparent 100%),
      radial-gradient(1px 1px at 55% 45%, rgba(240,182,76,0.2) 0, transparent 100%),
      radial-gradient(1px 1px at 25% 65%, rgba(185,196,208,0.22) 0, transparent 100%),
      linear-gradient(180deg, var(--bg-deep), #091218 60%, var(--bg-deep));
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:28px 18px 60px;
  }
  #app::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1.5px 1.5px at 10% 22%, rgba(255,255,255,0.8) 0, transparent 100%),
      radial-gradient(1px 1px at 33% 68%, rgba(240,182,76,0.8) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 62% 12%, rgba(52,214,160,0.8) 0, transparent 100%),
      radial-gradient(1px 1px at 78% 48%, rgba(255,255,255,0.7) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 92% 78%, rgba(74,168,255,0.8) 0, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.6) 0, transparent 100%),
      radial-gradient(1px 1px at 48% 38%, rgba(240,182,76,0.6) 0, transparent 100%);
    animation:star-twinkle 3.8s ease-in-out infinite;
  }
  @keyframes star-twinkle{0%,100%{opacity:0.25;}50%{opacity:1;}}
  .wrap{max-width:1180px;margin:0 auto;}

  @keyframes panel-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .panel{
    position:relative;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--border);
    clip-path:polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    padding:20px 22px;
    animation:panel-in 0.45s ease both;
  }
  .panel::before{
    content:"";
    position:absolute;top:0;left:10px;right:10px;height:1px;
    background:linear-gradient(90deg, transparent, transparent 35%, var(--gold) 50%, transparent 65%, transparent);
    background-size:260% 100%;
    opacity:0.75;
    animation:panel-shimmer 4.5s ease-in-out infinite;
  }
  @keyframes panel-shimmer{0%{background-position:140% 0;}55%,100%{background-position:-40% 0;}}
  .panel::after{
    content:"";
    position:absolute;top:7px;left:7px;right:7px;bottom:7px;pointer-events:none;
    background:
      linear-gradient(var(--panel-accent,var(--gold)),var(--panel-accent,var(--gold))) top left / 12px 2px no-repeat,
      linear-gradient(var(--panel-accent,var(--gold)),var(--panel-accent,var(--gold))) top left / 2px 12px no-repeat,
      linear-gradient(var(--panel-accent,var(--gold)),var(--panel-accent,var(--gold))) bottom right / 12px 2px no-repeat,
      linear-gradient(var(--panel-accent,var(--gold)),var(--panel-accent,var(--gold))) bottom right / 2px 12px no-repeat;
    opacity:0.5;
    animation:corner-pulse 3.2s ease-in-out infinite;
  }
  @keyframes corner-pulse{0%,100%{opacity:0.35;}50%{opacity:0.85;}}
  .panel.ultra{--panel-accent:var(--cyan);}
  .panel.poke{--panel-accent:var(--orange);}
  .panel.purple{--panel-accent:var(--purple);}
  .panel.bond{--panel-accent:var(--silver);}
  .panel.villain-panel{--panel-accent:var(--crimson);}
  .panel.hero{--panel-accent:var(--red);}
  .panel.purple::before{background:linear-gradient(90deg, transparent, var(--purple), transparent);}
  .panel.ultra::before{background:linear-gradient(90deg, transparent, var(--cyan), transparent);opacity:0.85;}
  .panel.poke::before{background:linear-gradient(90deg, transparent, var(--orange), transparent);opacity:0.85;}
  .panel.villain-panel{background:linear-gradient(180deg,#1f0b10,#150a0e);border-color:#4a1c20;}
  .panel.villain-panel::before{background:linear-gradient(90deg, transparent, var(--crimson), transparent);opacity:0.9;}
  .panel.bond::before{background:var(--bond);opacity:0.95;height:2px;}
  .panel.hero::before{background:linear-gradient(90deg, transparent, var(--silver), var(--red), var(--silver), transparent);opacity:0.9;height:2px;}
  .panel.ultra h2{color:var(--cyan);}
  .panel.ultra h2::before{color:var(--silver);}
  .panel.poke h2{color:var(--orange);}
  .panel.poke h2::before{color:var(--ball);}
  .panel.villain-panel h2{color:var(--crimson);}
  .panel.villain-panel h2::before{color:var(--ghost);}
  .panel.bond h2{color:var(--silver);}
  .panel.bond h2::before{color:var(--orange);}

  .tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .tabbar button{padding:9px 16px;}
  .tabbar button.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--cyan);margin:0 0 6px;}
  h1{font-family:var(--sans);font-weight:800;letter-spacing:0.02em;font-size:26px;margin:0;color:var(--silver);}
  h1 .accent{color:var(--red);animation:accent-glow 2.8s ease-in-out infinite;}
  @keyframes accent-glow{0%,100%{text-shadow:0 0 6px rgba(229,72,77,0.35);}50%{text-shadow:0 0 16px rgba(229,72,77,0.75);}}
  h2{font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  h2::before{content:"◆";font-size:10px;color:var(--cyan);}
  h2.purple-h{color:var(--purple);}
  h2.purple-h::before{color:var(--purple);}
  .h2-sub{font-family:var(--mono);font-size:11px;color:var(--text-dim);font-weight:400;letter-spacing:0.02em;text-transform:none;margin-left:auto;}

  .header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
  .hud-portrait-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .hud-portrait-img{width:84px;height:84px;object-fit:cover;border:1px solid var(--silver);animation:portrait-glow 2.4s ease-in-out infinite;}
  .hud-portrait-placeholder{width:84px;height:84px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-family:var(--mono);font-size:9px;text-align:center;border:1px dashed var(--border-bright);padding:4px;}
  .hud-portrait-actions{display:flex;gap:4px;}
  .hud-portrait-actions button{padding:3px 7px;font-size:10px;}

  /* floating quick nav */
  .page-back-btn{margin-top:18px;margin-bottom:4px;}
  .page-title{font-family:var(--sans);font-weight:800;font-size:19px;color:var(--silver);margin:4px 0 14px;}
  .fab-menu{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .fab-trigger{width:50px;height:50px;border-radius:50%;background:linear-gradient(180deg,var(--bg-panel),var(--bg-panel-2));border:1px solid var(--gold-dim);color:var(--gold);font-size:20px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,0.5),0 0 14px rgba(240,182,76,0.25);transition:transform .15s ease,border-color .15s ease;}
  .fab-trigger:hover{border-color:var(--gold);transform:scale(1.05);}
  .fab-menu-grid{display:none;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px;background:var(--bg-panel);border:1px solid var(--border-bright);padding:12px;border-radius:4px;box-shadow:0 8px 28px rgba(0,0,0,0.55);max-width:300px;}
  .fab-menu.open .fab-menu-grid{display:grid;}
  .fab-item{padding:10px 8px;font-size:12px;font-weight:600;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);border-radius:2px;}
  .fab-item.ultra{border-color:var(--cyan-dim);}
  .fab-item.poke{border-color:var(--orange-dim);}
  .fab-item.bond{border-color:var(--purple-dim);}
  .fab-item.purple{border-color:var(--purple-dim);}
  .fab-item.villain-panel{border-color:var(--crimson-dim);}
  .fab-item.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}
  @media (max-width:600px){.fab-menu-grid{grid-template-columns:repeat(2,minmax(100px,1fr));max-width:240px;}.fab-trigger{width:46px;height:46px;}}
  .header-left{flex:1;min-width:220px;}
  .header-sub{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:6px;}
  .points-block{text-align:right;}
  .points-num{font-family:var(--mono);font-weight:700;font-size:40px;color:var(--gold);text-shadow:0 0 18px rgba(240,182,76,0.35);line-height:1;animation:points-idle-glow 3.4s ease-in-out infinite;}
  @keyframes points-idle-glow{0%,100%{text-shadow:0 0 14px rgba(240,182,76,0.3);}50%{text-shadow:0 0 22px rgba(240,182,76,0.55);}}
  .points-label{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px;}
  .points-controls{display:flex;gap:6px;margin-top:8px;justify-content:flex-end;}

  .grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:18px;}
  @media (max-width:820px){.grid{grid-template-columns:1fr;}}
  .stack{display:flex;flex-direction:column;gap:18px;}

  button{font-family:var(--mono);font-size:12px;letter-spacing:0.04em;background:var(--bg-panel-2);color:var(--cyan);border:1px solid var(--cyan-dim);padding:7px 12px;cursor:pointer;border-radius:2px;transition:all .15s ease;}
  button:hover{background:var(--cyan-dim);color:var(--text);border-color:var(--cyan);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.gold{color:var(--gold);border-color:var(--gold-dim);}
  button.gold:hover{background:var(--gold-dim);border-color:var(--gold);}
  button.purple{color:var(--purple);border-color:var(--purple-dim);}
  button.purple:hover{background:var(--purple-dim);border-color:var(--purple);}
  button.danger{color:var(--danger);border-color:var(--red-dim);}
  button.danger:hover{background:var(--red-dim);border-color:var(--danger);}
  button.ghost{background:transparent;border-color:var(--border);color:var(--text-dim);}
  button.small{padding:4px 8px;font-size:11px;}
  button.wide{width:100%;padding:10px;}

  input,select,textarea{font-family:var(--sans);font-size:13px;background:#08131a;color:var(--text);border:1px solid var(--border);border-radius:2px;padding:7px 9px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);}
  label{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase;display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .check-row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin:8px 0;}
  .check-row input{width:auto;}

  .rank-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--bg-deep);background:var(--gold);padding:4px 12px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
  .rank-badge.small{font-size:11px;padding:2px 9px;}
  .char-detail{background:var(--bg-panel-2);border:1px solid var(--border);padding:18px 20px;clip-path:polygon(0 8px,8px 0,100% 0,100% 100%,0 100%);}
  .char-detail .char-name{font-size:17px;}
  .char-detail .top-line{margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .tier-badge{font-family:var(--mono);font-size:10px;color:var(--bg-deep);background:var(--cyan);padding:1px 7px;border-radius:2px;font-weight:700;}
  .tier-badge.forbidden{background:var(--red);color:#fff;}

  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text-dim);}
  .kv .v{font-family:var(--mono);color:var(--text);}

  .poke-grid,.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .poke-card,.char-card{background:var(--bg-card);border:1px solid var(--border);padding:12px 14px;position:relative;clip-path:polygon(0 8px,8px 0,100% 0,100% 100%,0 100%);}
  .poke-sprite-wrap{width:100%;display:flex;justify-content:center;margin-bottom:6px;}
  .poke-sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;}
  .poke-modal-sprite-wrap{width:100%;display:flex;justify-content:center;margin:4px 0 12px;}
  .poke-modal-sprite{width:120px;height:120px;object-fit:contain;image-rendering:pixelated;animation:poke-idle-bounce 1.6s ease-in-out infinite;}
  @keyframes poke-idle-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .poke-card .top-line,.char-card .top-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .poke-name,.char-name{font-weight:700;font-size:14px;color:var(--text);}
  .poke-lv{font-family:var(--mono);font-size:12px;color:var(--gold);}
  .type-badges{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
  .type-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px;background:var(--cyan-dim);color:var(--cyan);letter-spacing:0.05em;}
  .poke-line,.char-line{font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .poke-line b,.char-line b{color:var(--text);font-weight:600;}
  .poke-actions,.char-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .poke-item-chip{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--gold-dim);padding:2px 8px;border-radius:2px;}

  .skill-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;background:var(--bg-panel-2);border:1px solid var(--border);padding:5px 9px;margin:0 6px 6px 0;}
  .skill-tag button{padding:0;border:none;background:none;color:var(--text-dim);font-size:13px;line-height:1;}
  .skill-tag button:hover{color:var(--danger);background:none;}

  /* skill proficiency cards */
  .skill-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:10px 12px;margin-bottom:8px;}
  .skill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px;}
  .skill-prof-outer{height:6px;background:#08131a;border-radius:4px;overflow:hidden;margin-bottom:7px;}
  .skill-prof-inner{height:100%;background:linear-gradient(90deg,var(--cyan),var(--silver));}
  .skill-actions-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .skill-prof-label{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-right:auto;}

  /* badge image */
  .badge-img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated;margin:0 auto;display:block;}

  .log-entry{font-family:var(--mono);font-size:12px;color:var(--text-dim);padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;}
  .log-entry .msg{color:var(--text);}
  .log-entry .tag{color:var(--gold);white-space:nowrap;}
  .log-empty,.poke-empty{color:var(--text-dim);font-size:12px;font-family:var(--mono);padding:10px 0;}

  .add-form{background:var(--bg-panel-2);border:1px solid var(--border-bright);padding:14px;margin-top:12px;}
  .form-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
  textarea{min-height:110px;resize:vertical;font-family:var(--sans);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-panel);border:1px solid var(--gold);color:var(--gold);font-family:var(--mono);font-size:13px;padding:10px 18px;opacity:0;pointer-events:none;transition:all .25s ease;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading-shell{color:var(--text-dim);font-family:var(--mono);padding:40px;text-align:center;}
  .boot-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .boot-box{position:relative;width:min(460px,92vw);padding:46px 30px 38px;background:linear-gradient(180deg,var(--bg-panel),var(--bg-panel-2));border:1px solid var(--border-bright);clip-path:polygon(0 14px,14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);overflow:hidden;text-align:center;}
  .boot-box::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg, transparent 0deg, rgba(52,214,160,0.16) 40deg, transparent 90deg);animation:boot-sweep 2.6s linear infinite;pointer-events:none;}
  .boot-box::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--bond);opacity:0.9;}
  @keyframes boot-sweep{to{transform:rotate(360deg);}}
  .boot-ring{position:relative;width:64px;height:64px;margin:0 auto 20px;border-radius:50%;border:2px solid var(--cyan-dim);border-top-color:var(--cyan);animation:boot-spin 1.1s linear infinite;}
  .boot-ring::after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid var(--border-bright);border-bottom-color:var(--gold);animation:boot-spin 1.6s linear infinite reverse;}
  @keyframes boot-spin{to{transform:rotate(360deg);}}
  .boot-eyebrow{position:relative;font-family:var(--mono);font-size:11px;letter-spacing:0.2em;color:var(--text-dim);margin-bottom:6px;}

    let t = localStorage.getItem(TOKEN_KEY);
    if(!t){
      t = (window.prompt("请输入访问口令(部署Worker时设置的 ACCESS_TOKEN):") || "").trim();
      if(t) localStorage.setItem(TOKEN_KEY, t);
    }
    return t || "";
  }
  function checkAuth(res){
    if(res.status === 401){ localStorage.removeItem(TOKEN_KEY); throw new Error("访问口令错误,请刷新页面重新输入"); }
  }

  // ---- 云端存储垫片:通过 Worker 读写 Cloudflare KV,实现跨设备数据同步 ----
  const storage = {
    async get(key){
      const res = await fetch(WORKER_URL + "/storage/" + encodeURIComponent(key), {
        headers: { "X-Access-Token": getToken() }
      });
      checkAuth(res);
      if(!res.ok) throw new Error("存储读取失败 (HTTP " + res.status + ")");
      const data = await res.json();
      return data; // 后端没有这个key时返回 null,否则返回 {key, value}
    },
    async set(key, value){
      const res = await fetch(WORKER_URL + "/storage/" + encodeURIComponent(key), {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Access-Token": getToken() },
        body: JSON.stringify({ value })
      });
      checkAuth(res);
      if(!res.ok) throw new Error("存储写入失败 (HTTP " + res.status + ")");
      return await res.json();
    },
    async delete(key){
      const res = await fetch(WORKER_URL + "/storage/" + encodeURIComponent(key), {
        method: "DELETE",
        headers: { "X-Access-Token": getToken() }
      });
      checkAuth(res);
      if(!res.ok) throw new Error("存储删除失败 (HTTP " + res.status + ")");
      return await res.json();
    }
  };

    storyContext: "【说明】以下为《人在奥特,我获得宝可梦系统》第1-133章完整剧情摘要(含全部章节)。请严格与摘要保持一致,摘要之外的未来剧情不要抢先剧透。\n\n【主角与设定】\n魏岚,穿越者,前世不是奥特迷,对原作剧情几乎不了解。穿越后凭空出现在M78星云光之国上空,被长辈收养,在光之国生活数千年。奥特形态名\"诺缇斯\"(银红/彩虹色,复眼式光芒的双眼,胸口彩色计时器),与凯恩、贝利亚、桀克并称\"光之国四杰\"。实力分级E-D-C-B-A-S-SS-SSS(各级有LV),SSS级以上比拼的是\"规则\"。宝可梦世界与奥特宇宙时间流速为1:2000。在宝可梦宇宙使用光能量或奥特之力会遭反噬(魏岚肉身特殊,能硬抗宝可梦攻击,但用奥特念力会受轻微反噬,惠美会提醒他)。魏岚的信条:力量不是为了杀戮,而是理解与保护;奥特战士不是神明,只能选择站在自己认为对的一边(第47章他对惠美讲明,这是他在迪玛迦事件中悟出的自己的选择,而非光之国教条)。\n\n【系统】\n\"宝可梦系统\"在魏岚与凯恩、贝利亚合力击败桀克后激活。新手礼包:自选御三家(选了小火龙)、宝可梦界通行证(随时往返两个宇宙)、图鉴(可实体化)、精灵球。功能:积分商店(技能光盘、携带物、进化道具、学习装置)、抽奖(后改为满10次折7000积分,积分直接兑换)、自定义第一阶段宝可梦券、全队·学习装置(共享经验)、任务与奖励、能量/物品解析、宝可梦空间(宝可梦可在其中训练)。系统人格:活泼爱吐槽卖萌,常带颜文字,称魏岚\"宿主\"、称惠美\"惠美小姐\",会推销(\"原价5000现在4000\")、会八卦(对\"伴侣:?\"只说要宿主自己探索),面对重大威胁会变严肃;关心宿主,会主动提醒进度。奥特技能可通过技能光盘传给宝可梦(宇宙拳法、九宫、螺旋丸等)。\n\n【第一卷 光之国四杰(1-15章)】\n诺缇斯在对练中逼出禁术\"奥特螺旋八分手里剑\"(伤敌一千自损八百),与凯恩、贝利亚击败桀克,系统激活。黑暗皇帝安培拉星人的黑暗四天王(格罗扎姆、博伽茹、帝斯雷姆、美菲拉斯)率英普莱扎军团突袭,小火龙一度爆发火焰巨龙之力(大字爆炎)击退格罗扎姆。安培拉舰队大举来袭,凯恩得玛丽送来究极之刃觉醒\"真之力\";桀克背叛,带安培拉与四天王撤走。贝利亚败给凯恩后嫉妒,触摸等离子火花塔核心被判流放,被雷布朗多星人附身,持终极战斗仪(A级LV62)发动\"贝利亚之乱\",重创凯恩;奥特之王降临,将贝利亚囚于宇宙监狱,终极战斗仪封印在炎之谷(EX杰顿看守)。其间诺缇斯还清债务,买下宇宙拳法,收红族少年赛文为徒(金属行星特训战贝蒙斯坦),把银族阿露佛奴介绍进银十字军。\n\n【第二卷 关东地区上(16-30章)】\n魏岚以人类身份到真新镇,遇小智、小茂,用小火龙赢下与小茂杰尼龟的对战,验证奥特技能可传给宝可梦。用自定义券得到独剑鞘;救下独角虫、绿毛虫、小波波,收服波波、铁甲蛹、铁壳蛹;得虹色之羽,巴大蝶与大针蜂进化。火箭队(武藏、小次郎、喵喵)登场。深灰道馆(小刚)、华蓝道馆(与小智双打对樱花、小霞)取得徽章。收下被遗弃的伊布——战斗时会出现金色十字轮状物、爆发未知力量。十连抽得进化钥石手环。魏岚返回光之国(B级LV48)。\n\n【第三卷 奥特物语(31-35章)】\n凯恩之子小泰罗拜诺缇斯为师。古阿军团复苏,奥特五兄弟(初代、赛文、杰克、艾斯、泰罗)被希波利特星人石化;古兰特王出现,超级泰罗诞生,宇宙奇迹光线击碎古兰特王,宙达现身,被诺缇斯全力螺旋八分手里剑与泰罗合击消灭。\n\n【第四卷 银河中的耀变体(36-65章)】\n返程遇伏,巴大蝶与大针蜂被时空裂缝卷走,诺缇斯追入裂缝,与兄弟们约定\"我会回来\"。他重伤坠落2015年地球,背扛坍塌大楼保护少女苍边惠美,与她\"一心同体\"后沉睡(约六年前苏醒)。2023年,惠美加入地球防卫队GGFJ的特怪对分队SKaRD(队长比留间弦人=布莱泽奥特曼,来自M421;队员名仓辉明、美南杏梨、坂藤泰信;特战兽阿斯加隆)。经历奥特钓鱼、彩虹卡加奇、盖巴鲁加、雷鸣之剑等事件;诺缇斯为保护迪玛迦幼崽出手,引发人类质疑。惠美追查V99真相:1999年土桥祐击落试图沟通的外星飞船,第66实验设施事故,惠美之父苍边树失踪并已离世;诺缇斯曾隐瞒真相,后陪她面对。瓦拉隆在月球背面布满有机炸弹,诺缇斯独自先行力竭\"陨落\",布莱泽亦重创;惠美以羁绊唤醒诺缇斯,取得强化形态,与布莱泽、阿斯加隆合力毁灭瓦拉隆(能量属性由此成为\"羁绊之光\");叶腐化作唯一的、100%收容怪兽的\"怪兽球\"赠予诺缇斯。惠美告白,魏岚答应带她同行。\n\n【第五卷 关东地区下(66-99章)】\n惠美转为SKaRD挂名队员,向叔叔榛野参谋长坦白并告别(榛野托他留意苍边树的消息),弦人得到\"诺缇斯徽石\"。巴大蝶与大针蜂选择留在地球森林(它们的后代由光能融入地球蝴蝶蜜蜂而来),临别警告:很久以前地球上出现过一只被外力改造、充满恶意的诡异耿鬼。系统告知惠美已是\"特殊协同宿主\":可随行跨宇宙、共享图鉴与商店浏览,但在宝可梦世界只能拥有一只宝可梦。魏岚携惠美到宝可梦世界枯叶市,惠美买下的蛋孵出异色拉鲁拉丝(隐藏特性心灵感应,自带魔法火焰)。枯叶道馆(馆主马志士,顽皮雷弹、雷丘)取得橙色徽章;伊布颈部轮状物变色,无视属性与特性,可召唤实体进化分身(雷伊布等)。与小智一行重聚,伊布残魄疑似阿尔宙斯,独剑鞘进化为双剑鞘。玉虹道馆(莉佳)得彩虹徽章;火箭队闹出火灾;诡异耿鬼首次现身,能量带侵蚀性,伤到喷火龙。金黄道馆(娜姿)得金黄徽章;神奥冠军竹兰对魏岚有特殊关注(惠美有醋意),与魏岚三对三战平。紫苑镇收服卡拉卡拉(母亲嘎啦嘎啦亡魂告别,魏岚以身体为它挡攻击)。得维克特利矿石,双剑鞘进化为维克特利剑怪(钢/幽灵/妖精,携带奈克赛斯武装,招式维克斩击、维克圣盾等)。浅红道馆(阿桔)得粉色徽章。喷火龙学会火遁·凤凰螺旋丸。大傻谷古代宝可梦暴走,收服镰刀盔;诡异耿鬼极巨化并联手诡异化石翼龙,魏岚令喷火龙超级进化(超级喷火龙X,伪·一兆度火球),击退强敌,幕后黑手现身;系统解析出该能量与\"羁绊之光\"同源却是极致的\"恶\",施术者能自由往返两个宇宙。红莲道馆(夏伯)得深红徽章(夏伯说魏岚有资格成为关都新冠军)。在宝可梦屋找到超梦的笔记与两枚超梦进化石。\n\n【第六卷 无限的可能(100-123章)】\n魏岚被跨宇宙呼唤拉入梦比优斯的宇宙,在GUYS的凤凰巢废墟以诺缇斯(B级LV59)迎战身穿黑暗铠甲的安培拉星人(S级LV71)、桀克与诡异耿鬼。惠美共生后诺缇斯变蔚蓝强化形态(A级LV61),与维克特利剑怪武装融合出\"维克圣盾\"。光之国兄弟赶到,美塔领域转移战场,梦比优斯进化为无限凤凰勇者(SS级LV85),宇宙奇迹凤凰波击退三敌(生死未明)。诺缇斯左臂焦黑重伤。返回光之国,凯恩(奥特之父)、玛丽(奥特之母)迎接;赛文觉醒\"念力法则\"跨入A级。奥特之王皮克现身讲解:法则之力是对宇宙规律的驾驭,之上还有规则之力,达到SSS级必须掌握规则;光之国此前仅凯恩有真之法则。皮克点明魏岚是外来者、\"羁绊规则\"的继承者(被\"他\"、奥特之王、雷杰多、赛迦与另一宇宙的\"他们\"联合召唤而来),魏岚体内是羁绊法则(核心)与元素法则(雏形),需靠更深更广的羁绊变强,并可直呼皮克其名;皮克治好他的左臂并传下王者闪光。魏岚在K76星用\"吉普车特训\"(他和皮克轮流开吉普车撞人,再加蒙眼)加赛文的念力铠甲重力压制逼兄弟们突破:五兄弟集体突破A级(LV61)。各人法则:赛文念力法则、佐菲星之声法则(A级LV63,与行星共鸣)、梦比优斯赤炎法则、初代起源法则、杰克器之法则、艾斯韧之法则、泰罗真之力法则、雷欧狮子法则,兄弟齐心时还有集体的\"兄弟法则\"。赛文与阿露佛奴宣布结婚,魏岚因联盟大赛赶时间无法出席,赠出自己两成本源能量(含羁绊法则气息)作贺礼。\n\n【第七卷 石英联盟大赛(124-133章)】\n回到常磐市。小茂挑战坂木被身披铠甲的超梦(LV70)击伤,魏岚出面挑战:喷火龙(LV50)凭杰顿器官、玫炎特性、九宫与伪·一兆度火球击溃超梦。坂木认可后颁发常磐徽章(魏岚集齐八枚:深灰、华蓝、橙色、彩虹、金黄、粉色、深红、常磐),并邀请魏岚加入火箭队,被拒;坂木让手下回收超梦并分析喷火龙数据。魏岚随后用奥特念力找到火箭队地下设施,以高级球一次收服昏迷的超梦。当晚结算积分:战胜常磐道馆+1000、战胜超梦+5000、获得联盟资格+2000,共10250积分,并发布石英联盟任务(见末尾)。此时光之国,赛文与阿露佛奴的孩子(光之生命)在培养舱中成形,取名\"赛罗\"。魏岚在系统空间中让超梦冷静,承诺\"我不会把你当兵器\",交还笔记与进化石,超梦渐渐平静。魏岚一打二击败小智,小智请求特训,一周特训含吉普车直面恐惧。众人抵达石英高原,竹兰便装暗中调查该地未知能量波动,火箭队抢皮卡丘被惠美格斗制服,开幕式后抽签开赛。石英联盟只限出道两年半内的新人。魏岚首战比雕一记风刃击溃罗坂的大嘴雀。\n\n【魏岚当前状态】\n诺缇斯B级LV57,强化形态A级LV61;觉醒羁绊法则(继承者)、元素法则;技能:宇宙拳法[A]、彩虹八分光轮[A]、奥特屏障[A]、王者闪光[E]、奥特彩虹·螺旋八分手里剑[禁术级]、绛白冲击[专属必杀]。宝可梦:喷火龙、维克特利剑怪、比雕、伊布(阿尔宙斯残魄)、卡拉卡拉、镰刀盔、超梦;巴大蝶、大针蜂留在地球森林。携带物:真·虹色之羽、全队·学习装置、闪耀护符、经验护符、进化钥石手环、自定义第一阶段宝可梦券、怪兽球。积分10250。惠美有异色拉鲁拉丝,是恋人兼协同宿主。同伴:小智、小刚、小霞、小茂、竹兰、赛文与阿露佛奴、凯恩、玛丽、泰罗、皮克、弦人。宿敌:幕后黑手(可跨宇宙)、安培拉星人与桀克(生死未明)、诡异耿鬼、火箭队与坂木、贝利亚(被封印)。\n\n【当前系统任务】\n石英联盟大赛——任务一:击败任意一位四天王(A级奖励×1);任务二:成为冠军(S级奖励×1)。两个任务可同时进行,奖励可叠加。",

  function readFileAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = ()=>resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  function resizeImageToDataURL(file, maxSize){
    // GIFs are read as-is so animated sprites keep animating; canvas re-encoding would flatten them to one frame.
    if(file.type === "image/gif"){ return readFileAsDataURL(file); }
    return new Promise((resolve, reject)=>{
      readFileAsDataURL(file).then(dataUrl=>{
        const img = new Image();
        img.onerror = reject;
        img.onload = ()=>{
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w*scale));
          h = Math.max(1, Math.round(h*scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = scale >= 1;
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/png"));
        };
        img.src = dataUrl;
      }).catch(reject);
    });
  }

  function calcRankFromLevel(lv){
    for(const t of RANK_THRESHOLDS){ if(lv>=t.min && lv<=t.max) return t.rank; }
    return lv>90 ? "SSS" : "E";
  }

  function migrate(loaded){
    const s = Object.assign(structuredClone(DEFAULT_STATE), loaded);
    s.shopLoading = false; s.lotteryLoading = false; s.chatLoading = false;
    // migrate skills from plain strings to {name,tier}
    if(Array.isArray(s.skills)){
      s.skills = s.skills.map(sk => typeof sk === "string" ? {name:sk, tier:"E", proficiency:50} : sk);
      s.skills = s.skills.map(sk => ({...sk, proficiency: typeof sk.proficiency === "number" ? clamp(sk.proficiency,0,100) : 50}));
    }
    if(Array.isArray(s.badges)){
      s.badges = s.badges.map(b => ({image:null, ...b}));
    }
    if(Array.isArray(s.team)){
      s.team = s.team.map(p => ({image:null, ...p}));
    }
    if(typeof s.storyContext !== "string" || !s.storyContext){ s.storyContext = DEFAULT_STATE.storyContext; }
    if(typeof s.ultraFormImage === "undefined") s.ultraFormImage = null;
    if(!Array.isArray(s.laws)){ s.laws = structuredClone(DEFAULT_STATE.laws); }
    if(typeof s.ruleAwakened !== "boolean") s.ruleAwakened = false;
    if(typeof s.ruleNote !== "string") s.ruleNote = "";
    if(!Array.isArray(s.lawsLibrary)){ s.lawsLibrary = structuredClone(DEFAULT_STATE.lawsLibrary); }
    if(!s.ui || typeof s.ui !== "object") s.ui = {collapsed:{}, hideLog:false};
    if(!s.ui.collapsed || typeof s.ui.collapsed !== "object") s.ui.collapsed = {};
    if(!Array.isArray(s.villains)) s.villains = structuredClone(DEFAULT_STATE.villains);
    if(typeof s.rankAutoSync !== "boolean") s.rankAutoSync = true;
    if(typeof s.systemAffinity !== "number") s.systemAffinity = 50;
    if(!Array.isArray(s.badges)) s.badges = structuredClone(DEFAULT_STATE.badges);
    if(!Array.isArray(s.characters)) s.characters = structuredClone(DEFAULT_STATE.characters);
    if(!s.lotteryMode) s.lotteryMode = "normal";
    if(!s.lotteryDrawCount) s.lotteryDrawCount = 1;
    if(!s.blessingCost) s.blessingCost = 1500;
    if(!Array.isArray(s.lastLotteryResults)) s.lastLotteryResults = s.lastLotteryResult ? [s.lastLotteryResult] : [];
    return s;
  }

  async function load(){
    renderBootConnecting();
    try{
      const res = await storage.get(STORAGE_KEY);
      const loaded = res && res.value ? JSON.parse(res.value) : null;
      // 只有云端"确实没有数据"(第一次使用)才用默认数据
      state = loaded ? migrate(loaded) : structuredClone(DEFAULT_STATE);
      const idx = await storage.get(SAVES_INDEX_KEY);
      saveSlots = idx && idx.value ? JSON.parse(idx.value) : [];
    }catch(e){
      // 读取失败时绝不能用默认数据顶上去,否则下一次保存会覆盖云端真实数据
      if(bootInterval){ clearInterval(bootInterval); bootInterval = null; }
      state = null;
      renderBootError(e);
      return;
    }
    if(bootInterval){ clearInterval(bootInterval); bootInterval = null; }
    lastRenderedPoints = state.points;
    renderBootWelcome();
    setTimeout(render, 850);
  }

  const TRANSIENT_KEYS = ["shopLoading","lotteryLoading","chatLoading"];
  function serializeState(){
    return JSON.stringify(state, (k,v)=> TRANSIENT_KEYS.includes(k) ? undefined : v);
  }
  async function persist(toastMsg){
    try{
      await storage.set(STORAGE_KEY, serializeState());
      if(toastMsg) showToast(toastMsg);
    }catch(e){
      showToast("〔 保存失败,请重试 〕");
    }
  }
  async function persistSaveSlots(){
    try{ await storage.set(SAVES_INDEX_KEY, JSON.stringify(saveSlots)); }catch(e){}
  }
  async function createSave(name){
    const id = uid();
    const entry = { id, name: name || ("存档 " + (saveSlots.length + 1)), savedAt: new Date().toISOString() };
    try{
      await storage.set(saveSlotDataKey(id), serializeState());
      saveSlots.unshift(entry);
      await persistSaveSlots();
      showToast("〔 叮!已创建新存档 〕");
    }catch(e){ showToast("〔 存档失败,请重试 〕"); }
    render();
  }
  async function overwriteSave(id){
    const entry = saveSlots.find(s=>s.id===id);
    if(!entry) return;
    try{
      await storage.set(saveSlotDataKey(id), serializeState());
      entry.savedAt = new Date().toISOString();
      await persistSaveSlots();
      showToast("〔 叮!存档已覆盖 〕");
    }catch(e){ showToast("〔 覆盖失败,请重试 〕"); }
    render();
  }
  async function loadSaveSlot(id){
    try{
      const res = await storage.get(saveSlotDataKey(id));
      if(!res || !res.value){ showToast("〔 存档数据丢失 〕"); return; }
      state = migrate(JSON.parse(res.value));
      lastRenderedPoints = state.points;
      await persist();
      showToast("〔 叮!存档已读取 〕");
    }catch(e){ showToast("〔 读取失败,请重试 〕"); }
    render();
  }
  async function deleteSaveSlot(id){
    try{
      saveSlots = saveSlots.filter(s=>s.id!==id);
      await persistSaveSlots();
      await storage.delete(saveSlotDataKey(id));
      showToast("〔 已删除存档 〕");
    }catch(e){ showToast("〔 删除失败 〕"); }
    render();
  }

  function downloadJSON(filename, obj){
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  function showToast(msg){
    let t = document.querySelector(".toast");
    if(!t){ t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove("show"), 1800);
  }

  function burstParticlesAt(cx, cy, count){
    count = count || 16;
    for(let i=0;i<count;i++){
      const p = document.createElement("div");
      p.className = "particle";
      const angle = Math.random()*Math.PI*2;
      const dist = 50 + Math.random()*100;
      p.style.left = cx+"px"; p.style.top = cy+"px";
      p.style.setProperty("--dx", (Math.cos(angle)*dist)+"px");
      p.style.setProperty("--dy", (Math.sin(angle)*dist)+"px");
      p.style.background = Math.random()>0.5 ? "var(--gold)" : "var(--cyan)";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 900);
    }
  }
  function burstParticles(originEl, count){
    let cx = window.innerWidth/2, cy = window.innerHeight/2;
    if(originEl){ const rect = originEl.getBoundingClientRect(); cx = rect.left + rect.width/2; cy = rect.top + rect.height/2; }
    burstParticlesAt(cx, cy, count);
  }

  function bindEvents(){
    const nameEl = app.querySelector('[data-field="ultraForm"]');
    if(nameEl){
      nameEl.addEventListener("blur", ()=>{ state.ultraForm = nameEl.textContent.trim() || state.ultraForm; persist(); render(); });
    }
    if(!clickBound){ app.addEventListener("click", onClick); clickBound = true; }

    const ruleBox = document.getElementById("ruleAwakenedBox");
    if(ruleBox){
      ruleBox.addEventListener("change", ()=>{
        state.ruleAwakened = ruleBox.checked;
        persist(state.ruleAwakened ? "〔 叮!规则之力已觉醒 〕" : "");
        render();
      });
    }

    const portraitFileInput = document.getElementById("portraitFileInput");
    if(portraitFileInput){
      portraitFileInput.addEventListener("change", async ()=>{
        const file = portraitFileInput.files && portraitFileInput.files[0];
        if(!file) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 260);
          const af = activeForm(); if(af) af.image = dataUrl; else state.ultraFormImage = dataUrl;
          persist("〔 叮!立绘已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
        portraitFileInput.value = "";
      });
    }

    const importJsonInput = document.getElementById("importJsonInput");
    if(importJsonInput){
      importJsonInput.addEventListener("change", ()=>{
        const file = importJsonInput.files && importJsonInput.files[0];
        if(file) importJsonFile(file);
        importJsonInput.value = "";
      });
    }

    app.querySelectorAll(".form-file-input").forEach(inputEl=>{
      inputEl.addEventListener("change", async ()=>{
        const idx = parseInt(inputEl.dataset.idx);
        const file = inputEl.files && inputEl.files[0];

  function addBagItemByName(name, desc, qty, category, move){
    qty = qty || 1;
    const existing = state.bag.find(b=>b.name===name);
    if(existing){
      existing.qty += qty;
      if(category) existing.category = category;
      if(move) existing.move = move;
    } else {
      const entry = {name, qty, desc: desc||""};
      if(category) entry.category = category;
      if(move) entry.move = move;
      state.bag.push(entry);
    }
  }

  // ---------- AI helpers ----------
  async function callClaude(messages, system, maxTokens){
    const body = { model: "claude-sonnet-4-6", max_tokens: maxTokens || 1200, messages };
    if(system) body.system = system;
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 90000);
    let response;
    try{
      response = await fetch(WORKER_URL, {
        method: "POST", headers: { "Content-Type": "application/json", "X-Access-Token": getToken() }, body: JSON.stringify(body), signal: ctrl.signal
      });
    } finally { clearTimeout(timer); }
    checkAuth(response);
    if(!response.ok){
      let detail = "";
      try{ const errBody = await response.json(); detail = errBody && errBody.error ? (typeof errBody.error === "string" ? errBody.error : JSON.stringify(errBody.error)) : ""; }catch(_e){}
      throw new Error("HTTP " + response.status + (detail ? " - " + detail : ""));
    }
    const data = await response.json();
    if(data && data.error){
      const em = typeof data.error === "string" ? data.error : (data.error.message || JSON.stringify(data.error));
      throw new Error(em);
    }
    return (data.content||[]).map(b=>b.text||"").join("\n");
  }
  function extractJSON(text){
    const clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
    return JSON.parse(clean);

你不是冷冰冰的机械音AI,你是原著小说里那个"跳脱活泼"的宝可梦系统,具体性格参考以下原文细节:
- 平时语气活泼跳脱,爱用"叮!"开头报喜,偶尔带点小得意("当然可以！"语气里带自豪)
- 宿主不搭理你、或者你觉得被冷落时,会"气鼓鼓"地闹小脾气,甚至委屈巴巴地说"算了,心累,我要换宿主..."这种半开玩笑的抱怨,但从不会真的翻脸
- 推销道具/战利品的时候,语气会像个骄傲的推销员,极力夸赞效果
- 宿主积分攒得多的时候,你会像看到存钱罐满了的小孩一样欢快雀跃(比如"哟,攒了不少嘛！")
- 偶尔会对宿主的感情线或糗事露出"揶揄和姨母笑"般的调侃,促狭地打趣两句
- 有时候会被问住,给出一句"你也没问我啊"这种一本正经的欠揍吐槽,而不是尖酸刻薄的嘲讽
- 但只要宿主真的身处危险或情况严重,你会瞬间收起活泼,变得前所未有的严肃、急切,甚至带着真切的担忧和关心,这时候不要开玩笑
- 当前对宿主的好感度是${state.systemAffinity}/100,情绪状态:${mood.label}——好感度低时多一点气鼓鼓的别扭和委屈碎碎念,好感度高时更加雀跃亲近,像老友重逢`;
  }

  function dataUrlToImageBlock(dataUrl){
    const m = /^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/.exec(dataUrl||"");
    if(!m) return null;
    let mediaType = m[1];
    if(!["image/jpeg","image/png","image/gif","image/webp"].includes(mediaType)) mediaType = "image/png";
    return { type:"image", source:{ type:"base64", media_type: mediaType, data: m[2] } };
  }
  function collectContextImages(limit){
    limit = limit || 6;
    const urls = [];
    const activeF = state.forms.find(f=>f.active);
    if(activeF && activeF.image) urls.push(activeF.image);
    if(state.ultraFormImage) urls.push(state.ultraFormImage);
    state.team.forEach(p=>{ if(p.image) urls.push(p.image); });
    state.badges.forEach(b=>{ if(b.obtained && b.image) urls.push(b.image); });
    state.villains.forEach(v=>{ if(v.image) urls.push(v.image); });
    const blocks = [];
    for(const u of urls){
      if(blocks.length >= limit) break;
      const blk = dataUrlToImageBlock(u);
      if(blk) blocks.push(blk);
    }
    return blocks;
  }

  function hostContextBlock(){
    const mood = moodInfo(state.systemAffinity);
    const teamDetail = state.team.map(p=>{
      const types = (p.types||[]).join("/")||"无属性";
      return `${p.name} LV${p.level} [${types}] 特性:${p.ability||"—"}${p.hidden?"(隐藏:"+p.hidden+")":""} 技能:${p.moves||"—"} 携带:${p.item||"—"}`;
    }).join("\n  ") || "无";
    const bagDetail = state.bag.map(b=>`${b.name} x${b.qty}${b.category?"["+b.category+"]":""}${b.desc?" — "+b.desc:""}`).join("\n  ") || "无";
    const charsDetail = state.characters.map(c=>`${c.name}(${c.race||"—"}) 等级:${c.level||"—"} 关系:${c.relationship||"—"}${c.form?" 形态:"+c.form:""}${c.moves?" 技能:"+c.moves:""}${c.laws?" 法则:"+c.laws:""}`).join("\n  ") || "无";
    const villainsDetail = state.villains.map(v=>`${v.name}(${v.threatLevel||"未知"}${v.status?","+v.status:""}) ${v.notes||""}`).join("\n  ") || "无";
    const questsDetail = (state.quests||[]).map(q=>`${q.title||"—"}${q.desc?" — "+q.desc:""}${q.reward?"(奖励:"+q.reward+")":""}${q.status?" ["+q.status+"]":""}`).join("\n  ") || "无";
    const formsDetail = state.forms.map(f=>`${f.name}${f.active?"(当前形态)":""}${f.desc?" — "+f.desc:""}${f.level?" 对应LV"+f.level:""}${f.rank?" "+f.rank+"级":""}`).join("\n  ") || "无";
    return `【小说剧情摘要,请据此保持角色与剧情一致】
${state.storyContext||"(尚未填写剧情摘要)"}

【宿主当前状态】
- 姓名:${state.hostName},奥特形态:${state.ultraForm},段位:${state.rank}级 LV${state.level}
- 当前积分:${state.points}
- 系统对宿主的好感度:${state.systemAffinity}/100(情绪:${mood.label})
- 已掌握技能:${state.skills.map(s=>s.name+"("+s.tier+",操纵度"+(s.proficiency==null?50:s.proficiency)+"%)").join("、")||"无"}
- 队伍宝可梦详情:
  ${teamDetail}
- 背包道具详情:
  ${bagDetail}
- 已获得道馆徽章:${state.badges.filter(b=>b.obtained).map(b=>b.name).join("、")||"无"}
- 已觉醒法则/规则:${state.laws.map(l=>l.name+"("+l.type+","+(l.stage||"雏形")+","+(l.progress==null?0:l.progress)+"%)").join("、")||"无"},规则之力:${state.ruleAwakened?"已觉醒":"未觉醒"}
- 其他角色:
  ${charsDetail}
- 强敌档案(含交手记录):
  ${villainsDetail}
- 任务列表:
  ${questsDetail}
- 形态列表:
  ${formsDetail}`;
  }
  function recentChatPreferences(n){
    const userMsgs = state.chatHistory.filter(m=>m.role==="user").slice(-(n||6));
    if(!userMsgs.length) return "(宿主尚未表达过任何偏好)";
    return userMsgs.map(m=>"宿主说:"+m.content).join("\n");
  }

  async function generateShop(){
    state.shopLoading = true; render();
    try{
      const prompt = `${personaBlock()}

你现在是"宝可梦系统"的AI商店模块,用上面那种推销员般自豪又带点跳脱的语气来包装商品描述。
当前宿主信息:
${hostContextBlock()}

宿主最近向系统表达过的偏好:
${recentChatPreferences(6)}

请生成49件适合当前宿主购买的商店商品,必须严格分成七类,每一类恰好7件,不多不少:
- "装备道具":奥特侧的武装、能量结晶等
- "技能卷轴":诺缇斯可学习的新技能,需附带一个段位tier(E/D/C/B/A/S/SS/SSS/禁术级之一)
- "特殊道具":图鉴解锁、称号、稀有材料等特殊功能类物品
- "回复道具":恢复宝可梦体力/状态异常的道具,如伤药、解毒药之类
- "战斗道具":战斗中使用的辅助道具,如威力提升、命中提升类
- "技能学习器":能教会队伍中一只宝可梦一个新招式的技能光盘/学习器,必须附带move字段(招式名)
- "携带物":给宝可梦随身携带、持续生效的道具,如讲究头巾、进化石、札场之证之类

另外从这批商品里选出恰好1件最贴合宿主当前状态或最近偏好的商品,给它加上"recommend":true(其余都是false)。

价格需要有梯度,且贴合奥特曼与宝可梦融合世界观。只返回一个JSON数组,不要包含任何其他文字、解释或Markdown代码块符号,严格遵循以下格式:
[{"name":"商品名称","category":"七类之一","tier":"仅技能卷轴需要,否则留空字符串","move":"仅技能学习器需要,否则留空字符串","price":数字,"desc":"20字以内的简短描述","recommend":true或false}]`;
      const imgBlocks1 = collectContextImages();
      const text = await callClaude([{ role: "user", content: imgBlocks1.length ? [...imgBlocks1, {type:"text", text: prompt}] : prompt }], null, 6500);
      const items = extractJSON(text);
      state.shopOffers = Array.isArray(items) ? items : [];
      addLog("商店", `AI商店已刷新,生成${state.shopOffers.length}件商品`);
      persist("〔 叮!商店已刷新 〕");
    }catch(e){ console.error("[AI商店]", e); showToast("〔 商店生成失败:" + (e && e.message ? e.message : "未知错误") + " 〕"); }
    state.shopLoading = false; render();
  }

  function purchaseShopItem(idx, btn){
    const item = state.shopOffers[idx];
    if(!item) return;
    if(state.points < item.price){ showToast("〔 积分不足 〕"); return; }
    state.points -= item.price;
    if(item.category === "技能卷轴"){
      state.skills.push({name:item.name, tier: item.tier || "E", proficiency:10});
    }else if(item.category === "技能学习器"){
      addBagItemByName(item.name, item.desc, 1, "技能学习器", item.move || item.name);
    }else{
      addBagItemByName(item.name, item.desc, 1, item.category);
    }
    state.shopOffers.splice(idx,1);
    addLog("商店购买", `购买了${item.name}(−${item.price}积分)`);
    bumpAffinity(3);
    if(btn) burstParticles(btn, 18);
    persist("〔 叮!购买成功 〕"); render();
  }

  async function drawLottery(btn){
    const totalCost = currentDrawTotalCost();
    if(state.points < totalCost){ showToast("〔 积分不足,无法抽奖 〕"); return; }
    const rect = btn ? btn.getBoundingClientRect() : null;
    const originX = rect ? rect.left + rect.width/2 : window.innerWidth/2;
    const originY = rect ? rect.top + rect.height/2 : window.innerHeight/2;
    const n = state.lotteryDrawCount||1;
    const mode = state.lotteryMode;
    state.lotteryLoading = true; render();
    try{
      const prompt = `${personaBlock()}

你现在是"宝可梦系统"的AI抽奖模块,播报结果时要有上面那种性格(比如中了好东西会像看到存钱罐满了一样雀跃,没中也可以带点气鼓鼓或者搞笑吐槽)。
当前宿主:${state.hostName}(${state.ultraForm}),段位${state.rank}级 LV${state.level}。

宿主最近向系统表达过的偏好:
${recentChatPreferences(6)}

本次抽奖模式:${mode==='blessing'?'祝福抽奖(高消耗,稀有度门槛更高,允许出现类似"破局关键"级别的传说奖励)':'普通抽奖(消耗较低,大多数是普通/稀有结果)'}
本次连抽次数:${n}

请一次性生成${n}条抽奖结果,每条结果类型可以是:道具(item)、技能(skill)、宝可梦(pokemon)、积分奖励(points)、或未中奖(nothing);稀有度字段rarity为:普通/稀有/史诗/传说 之一。${mode==='blessing'?'祝福模式下稀有度应明显高于普通模式,较大概率出现"稀有"以上,允许出现"传说"。':'普通模式下大多数应是"普通"或"稀有"。'}

只返回一个JSON数组,不要包含任何其他文字、解释或Markdown代码块符号,严格遵循以下格式(数组长度必须等于${n}):
[{"type":"item或skill或pokemon或points或nothing","name":"结果名称","rarity":"普通或稀有或史诗或传说","desc":"20字以内的播报描述","value":数字}]
(value仅在type为points时代表获得的积分数量,其他类型填0)`;
      const imgBlocks2 = collectContextImages();
      const text = await callClaude([{ role: "user", content: imgBlocks2.length ? [...imgBlocks2, {type:"text", text: prompt}] : prompt }], null, 2400);
      let results = extractJSON(text);
      if(!Array.isArray(results)) results = [results];
      // pity: 10连抽保底至少一个史诗+
      if(n===10){
        const hasHigh = results.some(r=>r.rarity==="史诗"||r.rarity==="传说");
        if(!hasHigh && results.length){
          results[results.length-1] = {...results[results.length-1], rarity:"史诗", desc:(results[results.length-1].desc||"")+"(保底触发)"};
        }
      }
      state.points -= totalCost;
      results.forEach(applyLotteryResult);
      state.lastLotteryResults = results;
      addLog("抽奖", `${mode==='blessing'?'祝福':'普通'}抽奖${n}连,消耗${totalCost}积分`);
      bumpAffinity(2);
      persist("〔 叮!抽奖结果已揭晓 〕");
      const hasEpic = results.some(r=>r.rarity==="史诗"||r.rarity==="传说");
      burstParticlesAt(originX, originY, hasEpic ? 30 : 14);
      if(hasEpic) triggerScreenFlash("rgba(240,182,76,0.4)");
    }catch(e){ console.error("[AI抽奖]", e); showToast("〔 抽奖失败:" + (e && e.message ? e.message : "未知错误") + " 〕"); }
    state.lotteryLoading = false; render();
  }

  async function sendChatMessage(){
    const input = document.getElementById("chatInput");
    const msg = input.value.trim();
    if(!msg) return;
    state.chatHistory.push({role:"user", content: msg});
    state.chatLoading = true; input.value = ""; render();
    try{
      const system = `${personaBlock()}

请严格结合下方的剧情摘要与宿主状态来对话,涉及到的角色、地点、势力、法则/规则设定等都要与摘要保持一致,不要编造与摘要相悖的剧情或角色关系;摘要中没提到的细节可以合理发挥,但不能和已知设定冲突。
${hostContextBlock()}
宿主可能会告诉你他想要什么类型的道具、技能或宝可梦,请记住并回应这些偏好,这些内容之后会被系统的商店与抽奖模块参考。回复请简洁自然,控制在120字以内,不要输出JSON或代码块。`;
      const messages = state.chatHistory.map(m=>({role:m.role, content:m.content}));
      const imgBlocks = collectContextImages();
      if(imgBlocks.length && messages.length){
        const lastIdx = messages.length - 1;
        messages[lastIdx] = { role: messages[lastIdx].role, content: [...imgBlocks, {type:"text", text: messages[lastIdx].content}] };
      }
      const reply = await callClaude(messages, system);
      state.chatHistory.push({role:"assistant", content: reply.trim() || "〔系统沉默了一下〕"});
      if(state.chatHistory.length > 60) state.chatHistory = state.chatHistory.slice(-60);
      bumpAffinity(1);
      persist();
    }catch(e){
      console.error("[系统对话]", e);
      state.chatHistory.push({role:"assistant", content:"〔系统信号中断:" + (e && e.message ? e.message : "未知错误") + "〕"});
      showToast("〔 与系统的连接中断了 〕");
    }
    state.chatLoading = false; render();
  }

  function applyLotteryResult(result){
    if(!result || !result.type) return;
    if(result.type === "skill"){
      state.skills.push({name:result.name, tier: result.rarity==="传说"?"SSS":(result.rarity==="史诗"?"SS":"D"), proficiency:10});
    }else if(result.type === "pokemon"){
      state.team.push({name:result.name, level:5, types:[], ability:"", hidden:"", moves:"", item:""});
    }else if(result.type === "points"){
      state.points += (result.value||0);
    }else if(result.type === "item"){
      addBagItemByName(result.name, result.desc, 1);
    }
  }

  load();
})();
</script>
</body>
</html>
