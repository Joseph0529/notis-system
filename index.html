<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>诺缇斯的系统</title>
<style>
  html,body{margin:0;padding:0;background:#070d12;}
</style>
</head>
<body>
<div id="app"></div>
<style>
  :root{
    --bg-deep:#070d12;
    --bg-panel:#0e1a20;
    --bg-panel-2:#0b161c;
    --bg-card:#16282f;
    --border:#1d383b;
    --border-bright:#24484a;
    --gold:#f0b64c;
    --gold-dim:#6e5424;
    --cyan:#34d6a0;
    --cyan-dim:#154236;
    --purple:#4aa8ff;
    --purple-dim:#183a5c;
    --silver:#b9c4d0;
    --red:#e5484d;
    --red-dim:#4a1c20;
    --ball:#ee3b33;
    --orange:#ff8a3d;
    --orange-dim:#5a2f14;
    --violet:#7c6cff;
    --crimson:#c2283b;
    --crimson-dim:#3a1218;
    --ghost:#8b3fd9;
    --bond:linear-gradient(90deg,#ff5a5f,#ff9f43,#ffd166,#5ee08a,#4dd8e8,#5b9dff,#a77bff);
    --text:#e8edf2;
    --text-dim:#8ba0aa;
    --danger:#ff4d4f;
    --success:#5ee08a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  #app{
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(52,214,160,0.35) 0, transparent 100%),
      radial-gradient(1px 1px at 70% 15%, rgba(240,182,76,0.25) 0, transparent 100%),
      radial-gradient(1px 1px at 40% 80%, rgba(240,182,76,0.25) 0, transparent 100%),
      radial-gradient(1px 1px at 85% 60%, rgba(74,168,255,0.28) 0, transparent 100%),
      radial-gradient(1px 1px at 55% 45%, rgba(240,182,76,0.2) 0, transparent 100%),
      radial-gradient(1px 1px at 25% 65%, rgba(185,196,208,0.22) 0, transparent 100%),
      linear-gradient(180deg, var(--bg-deep), #091218 60%, var(--bg-deep));
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:28px 18px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  .panel{
    position:relative;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--border);
    clip-path:polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    padding:20px 22px;
  }
  .panel::before{
    content:"";
    position:absolute;top:0;left:10px;right:10px;height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.6;
  }
  .panel.purple::before{background:linear-gradient(90deg, transparent, var(--purple), transparent);}
  .panel.ultra::before{background:linear-gradient(90deg, transparent, var(--cyan), transparent);opacity:0.85;}
  .panel.poke::before{background:linear-gradient(90deg, transparent, var(--orange), transparent);opacity:0.85;}
  .panel.villain-panel{background:linear-gradient(180deg,#1f0b10,#150a0e);border-color:#4a1c20;}
  .panel.villain-panel::before{background:linear-gradient(90deg, transparent, var(--crimson), transparent);opacity:0.9;}
  .panel.bond::before{background:var(--bond);opacity:0.95;height:2px;}
  .panel.hero::before{background:linear-gradient(90deg, transparent, var(--silver), var(--red), var(--silver), transparent);opacity:0.9;height:2px;}
  .panel.ultra h2{color:var(--cyan);}
  .panel.ultra h2::before{color:var(--silver);}
  .panel.poke h2{color:var(--orange);}
  .panel.poke h2::before{color:var(--ball);}
  .panel.villain-panel h2{color:var(--crimson);}
  .panel.villain-panel h2::before{color:var(--ghost);}
  .panel.bond h2{color:var(--silver);}
  .panel.bond h2::before{color:var(--orange);}

  .tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .tabbar button{padding:9px 16px;}
  .tabbar button.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--cyan);margin:0 0 6px;}
  h1{font-family:var(--sans);font-weight:800;letter-spacing:0.02em;font-size:26px;margin:0;color:var(--silver);}
  h1 .accent{color:var(--red);}
  h2{font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  h2::before{content:"◆";font-size:10px;color:var(--cyan);}
  h2.purple-h{color:var(--purple);}
  h2.purple-h::before{color:var(--purple);}
  .h2-sub{font-family:var(--mono);font-size:11px;color:var(--text-dim);font-weight:400;letter-spacing:0.02em;text-transform:none;margin-left:auto;}

  .header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
  .hud-portrait-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .hud-portrait-img{width:84px;height:84px;object-fit:cover;border:1px solid var(--silver);animation:portrait-glow 2.4s ease-in-out infinite;}
  .hud-portrait-placeholder{width:84px;height:84px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-family:var(--mono);font-size:9px;text-align:center;border:1px dashed var(--border-bright);padding:4px;}
  .hud-portrait-actions{display:flex;gap:4px;}
  .hud-portrait-actions button{padding:3px 7px;font-size:10px;}

  /* floating quick nav */
  .quick-nav{position:fixed;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:11px;z-index:50;}
  .qn-dot{width:10px;height:10px;padding:0;border-radius:50%;background:var(--bg-panel-2);border:1px solid var(--border-bright);position:relative;cursor:pointer;transition:all .2s ease;}
  .qn-dot.active{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px rgba(52,214,160,0.6);}
  .qn-label{position:absolute;right:16px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--mono);font-size:10px;color:var(--text-dim);background:var(--bg-panel);padding:2px 6px;border:1px solid var(--border);border-radius:2px;opacity:0;pointer-events:none;transition:opacity .15s ease;}
  .qn-dot:hover .qn-label, .qn-dot.active .qn-label{opacity:1;}
  @media (max-width:600px){.quick-nav{right:2px;gap:9px;}.qn-dot{width:8px;height:8px;}}
  .header-left{flex:1;min-width:220px;}
  .header-sub{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:6px;}
  .points-block{text-align:right;}
  .points-num{font-family:var(--mono);font-weight:700;font-size:40px;color:var(--gold);text-shadow:0 0 18px rgba(240,182,76,0.35);line-height:1;}
  .points-label{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px;}
  .points-controls{display:flex;gap:6px;margin-top:8px;justify-content:flex-end;}

  .grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:18px;}
  @media (max-width:820px){.grid{grid-template-columns:1fr;}}
  .stack{display:flex;flex-direction:column;gap:18px;}

  button{font-family:var(--mono);font-size:12px;letter-spacing:0.04em;background:var(--bg-panel-2);color:var(--cyan);border:1px solid var(--cyan-dim);padding:7px 12px;cursor:pointer;border-radius:2px;transition:all .15s ease;}
  button:hover{background:var(--cyan-dim);color:var(--text);border-color:var(--cyan);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.gold{color:var(--gold);border-color:var(--gold-dim);}
  button.gold:hover{background:var(--gold-dim);border-color:var(--gold);}
  button.purple{color:var(--purple);border-color:var(--purple-dim);}
  button.purple:hover{background:var(--purple-dim);border-color:var(--purple);}
  button.danger{color:var(--danger);border-color:var(--red-dim);}
  button.danger:hover{background:var(--red-dim);border-color:var(--danger);}
  button.ghost{background:transparent;border-color:var(--border);color:var(--text-dim);}
  button.small{padding:4px 8px;font-size:11px;}
  button.wide{width:100%;padding:10px;}

  input,select,textarea{font-family:var(--sans);font-size:13px;background:#08131a;color:var(--text);border:1px solid var(--border);border-radius:2px;padding:7px 9px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);}
  label{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase;display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .check-row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin:8px 0;}
  .check-row input{width:auto;}

  .rank-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--bg-deep);background:var(--gold);padding:4px 12px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
  .rank-badge.small{font-size:11px;padding:2px 9px;}
  .char-detail{background:var(--bg-panel-2);border:1px solid var(--border);padding:18px 20px;clip-path:polygon(0 8px,8px 0,100% 0,100% 100%,0 100%);}
  .char-detail .char-name{font-size:17px;}
  .char-detail .top-line{margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .tier-badge{font-family:var(--mono);font-size:10px;color:var(--bg-deep);background:var(--cyan);padding:1px 7px;border-radius:2px;font-weight:700;}
  .tier-badge.forbidden{background:var(--red);color:#fff;}

  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text-dim);}
  .kv .v{font-family:var(--mono);color:var(--text);}

  .poke-grid,.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .poke-card,.char-card{background:var(--bg-card);border:1px solid var(--border);padding:12px 14px;position:relative;clip-path:polygon(0 8px,8px 0,100% 0,100% 100%,0 100%);}
  .poke-sprite-wrap{width:100%;display:flex;justify-content:center;margin-bottom:6px;}
  .poke-sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;}
  .poke-modal-sprite-wrap{width:100%;display:flex;justify-content:center;margin:4px 0 12px;}
  .poke-modal-sprite{width:120px;height:120px;object-fit:contain;image-rendering:pixelated;animation:poke-idle-bounce 1.6s ease-in-out infinite;}
  @keyframes poke-idle-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .poke-card .top-line,.char-card .top-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .poke-name,.char-name{font-weight:700;font-size:14px;color:var(--text);}
  .poke-lv{font-family:var(--mono);font-size:12px;color:var(--gold);}
  .type-badges{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
  .type-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px;background:var(--cyan-dim);color:var(--cyan);letter-spacing:0.05em;}
  .poke-line,.char-line{font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .poke-line b,.char-line b{color:var(--text);font-weight:600;}
  .poke-actions,.char-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .poke-item-chip{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--gold-dim);padding:2px 8px;border-radius:2px;}

  .skill-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;background:var(--bg-panel-2);border:1px solid var(--border);padding:5px 9px;margin:0 6px 6px 0;}
  .skill-tag button{padding:0;border:none;background:none;color:var(--text-dim);font-size:13px;line-height:1;}
  .skill-tag button:hover{color:var(--danger);background:none;}

  /* skill proficiency cards */
  .skill-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:10px 12px;margin-bottom:8px;}
  .skill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px;}
  .skill-prof-outer{height:6px;background:#08131a;border-radius:4px;overflow:hidden;margin-bottom:7px;}
  .skill-prof-inner{height:100%;background:linear-gradient(90deg,var(--cyan),var(--silver));}
  .skill-actions-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .skill-prof-label{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-right:auto;}

  /* badge image */
  .badge-img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated;margin:0 auto;display:block;}

  .log-entry{font-family:var(--mono);font-size:12px;color:var(--text-dim);padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;}
  .log-entry .msg{color:var(--text);}
  .log-entry .tag{color:var(--gold);white-space:nowrap;}
  .log-empty,.poke-empty{color:var(--text-dim);font-size:12px;font-family:var(--mono);padding:10px 0;}

  .add-form{background:var(--bg-panel-2);border:1px solid var(--border-bright);padding:14px;margin-top:12px;}
  .form-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
  textarea{min-height:110px;resize:vertical;font-family:var(--sans);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-panel);border:1px solid var(--gold);color:var(--gold);font-family:var(--mono);font-size:13px;padding:10px 18px;opacity:0;pointer-events:none;transition:all .25s ease;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading-shell{color:var(--text-dim);font-family:var(--mono);padding:40px;text-align:center;}

  .bag-list{display:flex;flex-direction:column;gap:8px;}
  .bag-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg-panel-2);border:1px solid var(--border);padding:9px 12px;}
  .bag-item .bi-main{flex:1;min-width:0;}
  .bag-item .bi-name{font-size:13px;font-weight:600;color:var(--text);}
  .bag-item .bi-desc{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .bag-item .bi-qty{font-family:var(--mono);color:var(--gold);font-size:13px;min-width:36px;text-align:center;}
  .bag-item .bi-actions{display:flex;gap:4px;align-items:center;}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .form-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:11px 13px;position:relative;}
  .form-card.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim) inset;}
  .form-card .fc-name{font-weight:700;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;}
  .form-card .fc-active-tag{font-family:var(--mono);font-size:9px;color:var(--bg-deep);background:var(--gold);padding:1px 6px;letter-spacing:0.05em;}
  .form-card .fc-desc{font-size:12px;color:var(--text-dim);margin:6px 0 8px;line-height:1.5;}
  .form-card .fc-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .quest-list{display:flex;flex-direction:column;gap:8px;}
  .quest-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:11px 13px;}
  .quest-card.done{opacity:0.55;}
  .quest-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .quest-title{font-weight:700;font-size:13px;color:var(--text);}
  .quest-status{font-family:var(--mono);font-size:10px;padding:2px 8px;letter-spacing:0.05em;white-space:nowrap;}
  .quest-status.ongoing{color:var(--cyan);background:var(--cyan-dim);}
  .quest-status.done{color:var(--success);background:#12331f;}
  .quest-desc{font-size:12px;color:var(--text-dim);margin:6px 0;line-height:1.5;}
  .quest-reward{font-family:var(--mono);font-size:11px;color:var(--gold);}
  .quest-actions{display:flex;gap:6px;margin-top:8px;}

  /* badges */
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .badge-chip{background:var(--bg-panel-2);border:1px solid var(--border);padding:12px;text-align:center;opacity:0.45;}
  .badge-chip.obtained{opacity:1;border-color:var(--gold);}
  .badge-icon{font-size:22px;color:var(--gold);}
  .badge-name{font-size:12px;margin-top:6px;color:var(--text);}
  .badge-actions{display:flex;gap:4px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
  .badge-icon-slot{width:40px;height:40px;margin:0 auto;display:flex;align-items:center;justify-content:center;}

  /* character pager */
  .char-pager-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .char-pager-nav button.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}
  .char-pager-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
  .char-pager-index{font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;}

  /* ultra form portrait */
  .portrait-wrap{width:100%;display:flex;justify-content:center;margin-bottom:14px;}
  .portrait-img{width:140px;height:140px;object-fit:cover;border:1px solid var(--border-bright);background:var(--bg-panel-2);animation:portrait-glow 2.4s ease-in-out infinite;}
  @keyframes portrait-glow{0%,100%{box-shadow:0 0 6px rgba(229,72,77,0.25);}50%{box-shadow:0 0 20px rgba(229,72,77,0.55);}}
  .portrait-actions{display:flex;gap:6px;justify-content:center;margin-bottom:14px;}

  /* villain dossier */
  .villain-card{background:#2a0f15;border:1px solid #5c2028;padding:12px 14px;position:relative;clip-path:polygon(0 8px,8px 0,100% 0,100% 100%,0 100%);}
  .villain-sprite-wrap{width:100%;display:flex;justify-content:center;margin-bottom:6px;}
  .villain-sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;}
  .threat-badge{font-family:var(--mono);font-size:10px;color:var(--text);background:var(--crimson-dim);padding:1px 7px;border-radius:2px;font-weight:700;}
  .threat-badge.high{background:var(--crimson);color:#fff;}

  /* affinity */
  .affinity-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .affinity-bar-outer{flex:1;min-width:160px;height:10px;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .affinity-bar-inner{height:100%;background:linear-gradient(90deg, var(--purple), var(--cyan));}
  .affinity-bar-outer{position:relative;}
  .affinity-bar-outer::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--bond);opacity:0.9;}
  .mood-tag{font-family:var(--mono);font-size:12px;color:var(--purple);border:1px solid var(--purple-dim);padding:3px 10px;border-radius:2px;white-space:nowrap;}
  .mood-flavor{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:8px;}

  /* AI shop */
  .shop-cat{margin-bottom:16px;}
  .shop-cat-title{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:0.08em;margin-bottom:8px;}
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .shop-card{background:var(--bg-panel-2);border:1px solid var(--border);padding:11px 13px;}
  .shop-card .sc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .shop-card .sc-name{font-weight:700;font-size:13px;color:var(--text);}
  .shop-card .sc-price{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:nowrap;}
  .shop-card .sc-desc{font-size:12px;color:var(--text-dim);line-height:1.5;margin:6px 0 8px;}
  .shop-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .shop-hint{font-family:var(--mono);font-size:11px;color:var(--text-dim);}

  /* lottery */
  .mode-btns{display:flex;gap:8px;margin-bottom:12px;}
  .mode-btns button{flex:1;}
  .mode-btns button.active.normal{background:var(--cyan-dim);color:var(--cyan);border-color:var(--cyan);}
  .mode-btns button.active.blessing{background:var(--purple-dim);color:var(--purple);border-color:var(--purple);}

  const TOKEN_KEY = "notis-access-token";
  function getToken(){
    let t = localStorage.getItem(TOKEN_KEY);
    if(!t){
      t = (window.prompt("请输入访问口令(部署Worker时设置的 ACCESS_TOKEN):") || "").trim();
      if(t) localStorage.setItem(TOKEN_KEY, t);
    }

  function checkAuth(res){

  const storage = {

        headers: { "X-Access-Token": getToken() }
      });
      checkAuth(res);
      if(!res.ok) throw new Error("存储读取失败 (HTTP " + res.status + ")");

      return data; // 后端没有这个key时返回 null,否则返回 {key, value}

      const res = await fetch(WORKER_URL + "/storage/" + encodeURIComponent(key), {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Access-Token": getToken() },
        body: JSON.stringify({ value })
      });
      checkAuth(res);
      if(!res.ok) throw new Error("存储写入失败 (HTTP " + res.status + ")");
      return await res.json();
    },

        headers: { "X-Access-Token": getToken() }
      });

    lawsNotes: "羁绊法则(核心)、元素法则(雏形)——需通过深化与他人的羁绊来强化。",
    storyContext: "【说明】以下为《人在奥特,我获得宝可梦系统》第1-133章完整剧情摘要(含全部章节)。请严格与摘要保持一致,摘要之外的未来剧情不要抢先剧透。\n\n【主角与设定】\n魏岚,穿越者,前世不是奥特迷,对原作剧情几乎不了解。穿越后凭空出现在M78星云光之国上空,被长辈收养,在光之国生活数千年。奥特形态名\"诺缇斯\"(银红/彩虹色,复眼式光芒的双眼,胸口彩色计时器),与凯恩、贝利亚、桀克并称\"光之国四杰\"。实力分级E-D-C-B-A-S-SS-SSS(各级有LV),SSS级以上比拼的是\"规则\"。宝可梦世界与奥特宇宙时间流速为1:2000。在宝可梦宇宙使用光能量或奥特之力会遭反噬(魏岚肉身特殊,能硬抗宝可梦攻击,但用奥特念力会受轻微反噬,惠美会提醒他)。魏岚的信条:力量不是为了杀戮,而是理解与保护;奥特战士不是神明,只能选择站在自己认为对的一边(第47章他对惠美讲明,这是他在迪玛迦事件中悟出的自己的选择,而非光之国教条)。\n\n【系统】\n\"宝可梦系统\"在魏岚与凯恩、贝利亚合力击败桀克后激活。新手礼包:自选御三家(选了小火龙)、宝可梦界通行证(随时往返两个宇宙)、图鉴(可实体化)、精灵球。功能:积分商店(技能光盘、携带物、进化道具、学习装置)、抽奖(后改为满10次折7000积分,积分直接兑换)、自定义第一阶段宝可梦券、全队·学习装置(共享经验)、任务与奖励、能量/物品解析、宝可梦空间(宝可梦可在其中训练)。系统人格:活泼爱吐槽卖萌,常带颜文字,称魏岚\"宿主\"、称惠美\"惠美小姐\",会推销(\"原价5000现在4000\")、会八卦(对\"伴侣:?\"只说要宿主自己探索),面对重大威胁会变严肃;关心宿主,会主动提醒进度。奥特技能可通过技能光盘传给宝可梦(宇宙拳法、九宫、螺旋丸等)。\n\n【第一卷 光之国四杰(1-15章)】\n诺缇斯在对练中逼出禁术\"奥特螺旋八分手里剑\"(伤敌一千自损八百),与凯恩、贝利亚击败桀克,系统激活。黑暗皇帝安培拉星人的黑暗四天王(格罗扎姆、博伽茹、帝斯雷姆、美菲拉斯)率英普莱扎军团突袭,小火龙一度爆发火焰巨龙之力(大字爆炎)击退格罗扎姆。安培拉舰队大举来袭,凯恩得玛丽送来究极之刃觉醒\"真之力\";桀克背叛,带安培拉与四天王撤走。贝利亚败给凯恩后嫉妒,触摸等离子火花塔核心被判流放,被雷布朗多星人附身,持终极战斗仪(A级LV62)发动\"贝利亚之乱\",重创凯恩;奥特之王降临,将贝利亚囚于宇宙监狱,终极战斗仪封印在炎之谷(EX杰顿看守)。其间诺缇斯还清债务,买下宇宙拳法,收红族少年赛文为徒(金属行星特训战贝蒙斯坦),把银族阿露佛奴介绍进银十字军。\n\n【第二卷 关东地区上(16-30章)】\n魏岚以人类身份到真新镇,遇小智、小茂,用小火龙赢下与小茂杰尼龟的对战,验证奥特技能可传给宝可梦。用自定义券得到独剑鞘;救下独角虫、绿毛虫、小波波,收服波波、铁甲蛹、铁壳蛹;得虹色之羽,巴大蝶与大针蜂进化。火箭队(武藏、小次郎、喵喵)登场。深灰道馆(小刚)、华蓝道馆(与小智双打对樱花、小霞)取得徽章。收下被遗弃的伊布——战斗时会出现金色十字轮状物、爆发未知力量。十连抽得进化钥石手环。魏岚返回光之国(B级LV48)。\n\n【第三卷 奥特物语(31-35章)】\n凯恩之子小泰罗拜诺缇斯为师。古阿军团复苏,奥特五兄弟(初代、赛文、杰克、艾斯、泰罗)被希波利特星人石化;古兰特王出现,超级泰罗诞生,宇宙奇迹光线击碎古兰特王,宙达现身,被诺缇斯全力螺旋八分手里剑与泰罗合击消灭。\n\n【第四卷 银河中的耀变体(36-65章)】\n返程遇伏,巴大蝶与大针蜂被时空裂缝卷走,诺缇斯追入裂缝,与兄弟们约定\"我会回来\"。他重伤坠落2015年地球,背扛坍塌大楼保护少女苍边惠美,与她\"一心同体\"后沉睡(约六年前苏醒)。2023年,惠美加入地球防卫队GGFJ的特怪对分队SKaRD(队长比留间弦人=布莱泽奥特曼,来自M421;队员名仓辉明、美南杏梨、坂藤泰信;特战兽阿斯加隆)。经历奥特钓鱼、彩虹卡加奇、盖巴鲁加、雷鸣之剑等事件;诺缇斯为保护迪玛迦幼崽出手,引发人类质疑。惠美追查V99真相:1999年土桥祐击落试图沟通的外星飞船,第66实验设施事故,惠美之父苍边树失踪并已离世;诺缇斯曾隐瞒真相,后陪她面对。瓦拉隆在月球背面布满有机炸弹,诺缇斯独自先行力竭\"陨落\",布莱泽亦重创;惠美以羁绊唤醒诺缇斯,取得强化形态,与布莱泽、阿斯加隆合力毁灭瓦拉隆(能量属性由此成为\"羁绊之光\");叶腐化作唯一的、100%收容怪兽的\"怪兽球\"赠予诺缇斯。惠美告白,魏岚答应带她同行。\n\n【第五卷 关东地区下(66-99章)】\n惠美转为SKaRD挂名队员,向叔叔榛野参谋长坦白并告别(榛野托他留意苍边树的消息),弦人得到\"诺缇斯徽石\"。巴大蝶与大针蜂选择留在地球森林(它们的后代由光能融入地球蝴蝶蜜蜂而来),临别警告:很久以前地球上出现过一只被外力改造、充满恶意的诡异耿鬼。系统告知惠美已是\"特殊协同宿主\":可随行跨宇宙、共享图鉴与商店浏览,但在宝可梦世界只能拥有一只宝可梦。魏岚携惠美到宝可梦世界枯叶市,惠美买下的蛋孵出异色拉鲁拉丝(隐藏特性心灵感应,自带魔法火焰)。枯叶道馆(馆主马志士,顽皮雷弹、雷丘)取得橙色徽章;伊布颈部轮状物变色,无视属性与特性,可召唤实体进化分身(雷伊布等)。与小智一行重聚,伊布残魄疑似阿尔宙斯,独剑鞘进化为双剑鞘。玉虹道馆(莉佳)得彩虹徽章;火箭队闹出火灾;诡异耿鬼首次现身,能量带侵蚀性,伤到喷火龙。金黄道馆(娜姿)得金黄徽章;神奥冠军竹兰对魏岚有特殊关注(惠美有醋意),与魏岚三对三战平。紫苑镇收服卡拉卡拉(母亲嘎啦嘎啦亡魂告别,魏岚以身体为它挡攻击)。得维克特利矿石,双剑鞘进化为维克特利剑怪(钢/幽灵/妖精,携带奈克赛斯武装,招式维克斩击、维克圣盾等)。浅红道馆(阿桔)得粉色徽章。喷火龙学会火遁·凤凰螺旋丸。大傻谷古代宝可梦暴走,收服镰刀盔;诡异耿鬼极巨化并联手诡异化石翼龙,魏岚令喷火龙超级进化(超级喷火龙X,伪·一兆度火球),击退强敌,幕后黑手现身;系统解析出该能量与\"羁绊之光\"同源却是极致的\"恶\",施术者能自由往返两个宇宙。红莲道馆(夏伯)得深红徽章(夏伯说魏岚有资格成为关都新冠军)。在宝可梦屋找到超梦的笔记与两枚超梦进化石。\n\n【第六卷 无限的可能(100-123章)】\n魏岚被跨宇宙呼唤拉入梦比优斯的宇宙,在GUYS的凤凰巢废墟以诺缇斯(B级LV59)迎战身穿黑暗铠甲的安培拉星人(S级LV71)、桀克与诡异耿鬼。惠美共生后诺缇斯变蔚蓝强化形态(A级LV61),与维克特利剑怪武装融合出\"维克圣盾\"。光之国兄弟赶到,美塔领域转移战场,梦比优斯进化为无限凤凰勇者(SS级LV85),宇宙奇迹凤凰波击退三敌(生死未明)。诺缇斯左臂焦黑重伤。返回光之国,凯恩(奥特之父)、玛丽(奥特之母)迎接;赛文觉醒\"念力法则\"跨入A级。奥特之王皮克现身讲解:法则之力是对宇宙规律的驾驭,之上还有规则之力,达到SSS级必须掌握规则;光之国此前仅凯恩有真之法则。皮克点明魏岚是外来者、\"羁绊规则\"的继承者(被\"他\"、奥特之王、雷杰多、赛迦与另一宇宙的\"他们\"联合召唤而来),魏岚体内是羁绊法则(核心)与元素法则(雏形),需靠更深更广的羁绊变强,并可直呼皮克其名;皮克治好他的左臂并传下王者闪光。魏岚在K76星用\"吉普车特训\"(他和皮克轮流开吉普车撞人,再加蒙眼)加赛文的念力铠甲重力压制逼兄弟们突破:五兄弟集体突破A级(LV61)。各人法则:赛文念力法则、佐菲星之声法则(A级LV63,与行星共鸣)、梦比优斯赤炎法则、初代起源法则、杰克器之法则、艾斯韧之法则、泰罗真之力法则、雷欧狮子法则,兄弟齐心时还有集体的\"兄弟法则\"。赛文与阿露佛奴宣布结婚,魏岚因联盟大赛赶时间无法出席,赠出自己两成本源能量(含羁绊法则气息)作贺礼。\n\n【第七卷 石英联盟大赛(124-133章)】\n回到常磐市。小茂挑战坂木被身披铠甲的超梦(LV70)击伤,魏岚出面挑战:喷火龙(LV50)凭杰顿器官、玫炎特性、九宫与伪·一兆度火球击溃超梦。坂木认可后颁发常磐徽章(魏岚集齐八枚:深灰、华蓝、橙色、彩虹、金黄、粉色、深红、常磐),并邀请魏岚加入火箭队,被拒;坂木让手下回收超梦并分析喷火龙数据。魏岚随后用奥特念力找到火箭队地下设施,以高级球一次收服昏迷的超梦。当晚结算积分:战胜常磐道馆+1000、战胜超梦+5000、获得联盟资格+2000,共10250积分,并发布石英联盟任务(见末尾)。此时光之国,赛文与阿露佛奴的孩子(光之生命)在培养舱中成形,取名\"赛罗\"。魏岚在系统空间中让超梦冷静,承诺\"我不会把你当兵器\",交还笔记与进化石,超梦渐渐平静。魏岚一打二击败小智,小智请求特训,一周特训含吉普车直面恐惧。众人抵达石英高原,竹兰便装暗中调查该地未知能量波动,火箭队抢皮卡丘被惠美格斗制服,开幕式后抽签开赛。石英联盟只限出道两年半内的新人。魏岚首战比雕一记风刃击溃罗坂的大嘴雀。\n\n【魏岚当前状态】\n诺缇斯B级LV57,强化形态A级LV61;觉醒羁绊法则(继承者)、元素法则;技能:宇宙拳法[A]、彩虹八分光轮[A]、奥特屏障[A]、王者闪光[E]、奥特彩虹·螺旋八分手里剑[禁术级]、绛白冲击[专属必杀]。宝可梦:喷火龙、维克特利剑怪、比雕、伊布(阿尔宙斯残魄)、卡拉卡拉、镰刀盔、超梦;巴大蝶、大针蜂留在地球森林。携带物:真·虹色之羽、全队·学习装置、闪耀护符、经验护符、进化钥石手环、自定义第一阶段宝可梦券、怪兽球。积分10250。惠美有异色拉鲁拉丝,是恋人兼协同宿主。同伴:小智、小刚、小霞、小茂、竹兰、赛文与阿露佛奴、凯恩、玛丽、泰罗、皮克、弦人。宿敌:幕后黑手(可跨宇宙)、安培拉星人与桀克(生死未明)、诡异耿鬼、火箭队与坂木、贝利亚(被封印)。\n\n【当前系统任务】\n石英联盟大赛——任务一:击败任意一位四天王(A级奖励×1);任务二:成为冠军(S级奖励×1)。两个任务可同时进行,奖励可叠加。",

  function readFileAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = ()=>resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  function resizeImageToDataURL(file, maxSize){
    // GIFs are read as-is so animated sprites keep animating; canvas re-encoding would flatten them to one frame.
    if(file.type === "image/gif"){ return readFileAsDataURL(file); }
    return new Promise((resolve, reject)=>{
      readFileAsDataURL(file).then(dataUrl=>{
        const img = new Image();
        img.onerror = reject;
        img.onload = ()=>{
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w*scale));
          h = Math.max(1, Math.round(h*scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = scale >= 1;
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/png"));
        };
        img.src = dataUrl;
      }).catch(reject);
    });
  }

  function calcRankFromLevel(lv){
    for(const t of RANK_THRESHOLDS){ if(lv>=t.min && lv<=t.max) return t.rank; }
    return lv>90 ? "SSS" : "E";
  }

  function migrate(loaded){
    const s = Object.assign(structuredClone(DEFAULT_STATE), loaded);
    s.shopLoading = false; s.lotteryLoading = false; s.chatLoading = false;
    // migrate skills from plain strings to {name,tier}
    if(Array.isArray(s.skills)){
      s.skills = s.skills.map(sk => typeof sk === "string" ? {name:sk, tier:"E", proficiency:50} : sk);
      s.skills = s.skills.map(sk => ({...sk, proficiency: typeof sk.proficiency === "number" ? clamp(sk.proficiency,0,100) : 50}));
    }
    if(Array.isArray(s.badges)){
      s.badges = s.badges.map(b => ({image:null, ...b}));
    }
    if(Array.isArray(s.team)){
      s.team = s.team.map(p => ({image:null, ...p}));
    }
    if(typeof s.storyContext !== "string" || !s.storyContext){ s.storyContext = DEFAULT_STATE.storyContext; }
    if(typeof s.ultraFormImage === "undefined") s.ultraFormImage = null;
    if(!s.ui || typeof s.ui !== "object") s.ui = {collapsed:{}, hideLog:false};
    if(!s.ui.collapsed || typeof s.ui.collapsed !== "object") s.ui.collapsed = {};
    if(!Array.isArray(s.villains)) s.villains = structuredClone(DEFAULT_STATE.villains);
    if(typeof s.rankAutoSync !== "boolean") s.rankAutoSync = true;
    if(typeof s.systemAffinity !== "number") s.systemAffinity = 50;
    if(!Array.isArray(s.badges)) s.badges = structuredClone(DEFAULT_STATE.badges);
    if(!Array.isArray(s.characters)) s.characters = structuredClone(DEFAULT_STATE.characters);
    if(!s.lotteryMode) s.lotteryMode = "normal";
    if(!s.lotteryDrawCount) s.lotteryDrawCount = 1;
    if(!s.blessingCost) s.blessingCost = 1500;
    if(!Array.isArray(s.lastLotteryResults)) s.lastLotteryResults = s.lastLotteryResult ? [s.lastLotteryResult] : [];
    return s;
  }

  async function load(){
    app.innerHTML = '<div class="loading-shell">〔 正在连接系统面板... 〕</div>';
    try{
      const res = await storage.get(STORAGE_KEY);
      const loaded = res && res.value ? JSON.parse(res.value) : null;
      // 只有云端"确实没有数据"(第一次使用)才用默认数据
      state = loaded ? migrate(loaded) : structuredClone(DEFAULT_STATE);
      const idx = await storage.get(SAVES_INDEX_KEY);
      saveSlots = idx && idx.value ? JSON.parse(idx.value) : [];
    }catch(e){
      // 读取失败时绝不能用默认数据顶上去,否则下一次保存会覆盖云端真实数据
      state = null;
      app.innerHTML = '<div class="loading-shell">〔 无法连接云端存储:' + String(e.message||e) + ' 〕<br><br>你的数据没有受到影响。<br><br><button class="gold" id="retryLoadBtn">重试</button></div>';
      document.getElementById("retryLoadBtn").addEventListener("click", load);
      return;
    }
    lastRenderedPoints = state.points;
    render();
  }

  const TRANSIENT_KEYS = ["shopLoading","lotteryLoading","chatLoading"];
  function serializeState(){
    return JSON.stringify(state, (k,v)=> TRANSIENT_KEYS.includes(k) ? undefined : v);
  }
  async function persist(toastMsg){
    try{
      await storage.set(STORAGE_KEY, serializeState());
      if(toastMsg) showToast(toastMsg);
    }catch(e){
      showToast("〔 保存失败,请重试 〕");
    }
  }
  async function persistSaveSlots(){
    try{ await storage.set(SAVES_INDEX_KEY, JSON.stringify(saveSlots)); }catch(e){}
  }
  async function createSave(name){
    const id = uid();
    const entry = { id, name: name || ("存档 " + (saveSlots.length + 1)), savedAt: new Date().toISOString() };
    try{
      await storage.set(saveSlotDataKey(id), serializeState());
      saveSlots.unshift(entry);
      await persistSaveSlots();
      showToast("〔 叮!已创建新存档 〕");
    }catch(e){ showToast("〔 存档失败,请重试 〕"); }
    render();
  }
  async function overwriteSave(id){
    const entry = saveSlots.find(s=>s.id===id);
    if(!entry) return;
    try{
      await storage.set(saveSlotDataKey(id), serializeState());
      entry.savedAt = new Date().toISOString();
      await persistSaveSlots();
      showToast("〔 叮!存档已覆盖 〕");
    }catch(e){ showToast("〔 覆盖失败,请重试 〕"); }
    render();
  }
  async function loadSaveSlot(id){
    try{
      const res = await storage.get(saveSlotDataKey(id));
      if(!res || !res.value){ showToast("〔 存档数据丢失 〕"); return; }
      state = migrate(JSON.parse(res.value));
      lastRenderedPoints = state.points;
      await persist();
      showToast("〔 叮!存档已读取 〕");
    }catch(e){ showToast("〔 读取失败,请重试 〕"); }
    render();
  }
  async function deleteSaveSlot(id){
    try{
      saveSlots = saveSlots.filter(s=>s.id!==id);
      await persistSaveSlots();
      await storage.delete(saveSlotDataKey(id));
      showToast("〔 已删除存档 〕");
    }catch(e){ showToast("〔 删除失败 〕"); }
    render();
  }

  function downloadJSON(filename, obj){
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  function exportCurrentState(){
    const fname = `${state.hostName||"存档"}-${state.ultraForm||""}-${new Date().toISOString().slice(0,10)}.json`;
    downloadJSON(fname, JSON.parse(serializeState()));
    showToast("〔 叮!存档已导出 〕");
  }

  async function exportSaveSlot(id){
    const entry = saveSlots.find(s=>s.id===id);
    if(!entry) return;
    try{
      const res = await storage.get(saveSlotDataKey(id));
      if(!res || !res.value){ showToast("〔 存档数据丢失 〕"); return; }
      downloadJSON(`${entry.name}.json`, JSON.parse(res.value));
      showToast("〔 叮!存档已导出 〕");
    }catch(e){ showToast("〔 导出失败,请重试 〕"); }
  }

  async function importJsonFile(file){
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      state = migrate(parsed);
      lastRenderedPoints = state.points;
      await persist("〔 叮!存档已导入 〕");
    }catch(e){ showToast("〔 导入失败:文件格式不正确 〕"); }
    render();
  }

  function showToast(msg){
    let t = document.querySelector(".toast");
    if(!t){ t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove("show"), 1800);
  }

  function burstParticlesAt(cx, cy, count){
    count = count || 16;
    for(let i=0;i<count;i++){
      const p = document.createElement("div");
      p.className = "particle";
      const angle = Math.random()*Math.PI*2;
      const dist = 50 + Math.random()*100;
      p.style.left = cx+"px"; p.style.top = cy+"px";
      p.style.setProperty("--dx", (Math.cos(angle)*dist)+"px");
      p.style.setProperty("--dy", (Math.sin(angle)*dist)+"px");
      p.style.background = Math.random()>0.5 ? "var(--gold)" : "var(--cyan)";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 900);
    }
  }
  function burstParticles(originEl, count){
    let cx = window.innerWidth/2, cy = window.innerHeight/2;
    if(originEl){ const rect = originEl.getBoundingClientRect(); cx = rect.left + rect.width/2; cy = rect.top + rect.height/2; }
    burstParticlesAt(cx, cy, count);
  }
  function triggerScreenFlash(color){
    const f = document.createElement("div");
    f.className = "screen-flash";
    f.style.background = `radial-gradient(circle, ${color||"rgba(240,182,76,0.35)"}, transparent 70%)`;
    document.body.appendChild(f);
    setTimeout(()=>f.remove(), 700);
  }

        pointsEl.classList.add(state.points > lastRenderedPoints ? "flash-up" : "flash-down");

    }

  function currentDrawUnitCost(){ return state.lotteryMode==="blessing" ? (state.blessingCost||1500) : (state.lotteryCost||500); }
  function currentDrawTotalCost(){
    const unit = currentDrawUnitCost();
    const n = state.lotteryDrawCount||1;
    const discount = n===10?0.9:(n===5?0.95:1);
    return Math.round(unit*n*discount);
  }

    return cats.map(cat=>{

      return `

            ${items.map(s=>`
              <div class="shop-card">
                <div class="sc-top"><span class="sc-name">${s.name}</span><span class="sc-price">${s.price}pt</span></div>
                <div class="sc-desc">${s.desc||""}${s.tier?` (${s.tier})`:""}</div>
                <button class="small gold" data-action="buy-shop-item" data-idx="${s._idx}">购买</button>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }).join("");
  }

  function renderLotteryResult(r){
    const typeLabel = {item:"道具", skill:"技能", pokemon:"宝可梦", points:"积分", nothing:"未中奖"}[r.type] || r.type;
    const epic = r.rarity==="史诗" || r.rarity==="传说";
    return `
      <div class="lottery-result ${epic?'epic':''}">
        <div class="lr-type">${typeLabel}${r.rarity?(' · '+r.rarity):''}</div>
        <div class="lr-name">${r.name}</div>
        <div class="lr-desc">${r.desc||""}</div>
      </div>
    `;
  }

  function renderChatMsg(m){
    return `<div class="chat-msg ${m.role}"><div class="cm-role">${m.role==='user' ? '宿主' : '系统'}</div><div>${m.content}</div></div>`;
  }
  function fmtTime(iso){
    try{
      const d = new Date(iso);
      return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    }catch(e){ return ""; }
  }
  function renderSaveRow(s){
    return `
      <div class="save-row" data-id="${s.id}">
        <div class="sv-main"><div class="sv-name">${s.name}</div><div class="sv-time">${fmtTime(s.savedAt)}</div></div>
        <div class="sv-actions">
          <button class="small gold" data-action="load-save" data-id="${s.id}">读取</button>
          <button class="small" data-action="overwrite-save" data-id="${s.id}">覆盖</button>
          <button class="small" data-action="export-save" data-id="${s.id}">导出</button>
          <button class="small danger" data-action="delete-save" data-id="${s.id}">删除</button>
        </div>
      </div>
    `;
  }

      <div class="modal-backdrop" data-action="close-poke-modal">
        <div class="modal-box" data-stop="1">
          <button class="modal-close" data-action="close-poke-modal">✕</button>

            <div style="margin-top:6px">${(p.moves||"—").split(/、|,|，/).filter(Boolean).map(m=>`<span class="skill-tag">${m.trim()}</span>`).join("") || "—"}</div>

  let clickBound = false;
  function bindEvents(){
    const nameEl = app.querySelector('[data-field="ultraForm"]');
    if(nameEl){
      nameEl.addEventListener("blur", ()=>{ state.ultraForm = nameEl.textContent.trim() || state.ultraForm; persist(); render(); });
    }
    if(!clickBound){ app.addEventListener("click", onClick); clickBound = true; }

    if(sectionObserver) sectionObserver.disconnect();
    const sections = QUICK_NAV.map(s=>document.getElementById(s.id)).filter(Boolean);
    if(sections.length){
      sectionObserver = new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          const dot = document.querySelector(`.qn-dot[data-target="${entry.target.id}"]`);
          if(!dot) return;
          if(entry.isIntersecting) dot.classList.add("active");
          else dot.classList.remove("active");
        });
      }, {rootMargin:"-40% 0px -50% 0px", threshold:0});
      sections.forEach(el=>sectionObserver.observe(el));
    }

    const portraitFileInput = document.getElementById("portraitFileInput");
    if(portraitFileInput){
      portraitFileInput.addEventListener("change", async ()=>{
        const file = portraitFileInput.files && portraitFileInput.files[0];
        if(!file) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 260);
          const af = activeForm(); if(af) af.image = dataUrl; else state.ultraFormImage = dataUrl;
          persist("〔 叮!立绘已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
        portraitFileInput.value = "";
      });
    }

    const importJsonInput = document.getElementById("importJsonInput");
    if(importJsonInput){
      importJsonInput.addEventListener("change", ()=>{
        const file = importJsonInput.files && importJsonInput.files[0];
        if(file) importJsonFile(file);
        importJsonInput.value = "";
      });
    }

    app.querySelectorAll(".form-file-input").forEach(inputEl=>{
      inputEl.addEventListener("change", async ()=>{
        const idx = parseInt(inputEl.dataset.idx);
        const file = inputEl.files && inputEl.files[0];
        if(!file || !state.forms[idx]) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 240);
          state.forms[idx].image = dataUrl;
          persist("〔 叮!形态图片已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
      });
    });

    app.querySelectorAll(".villain-file-input").forEach(inputEl=>{
      inputEl.addEventListener("change", async ()=>{
        const idx = parseInt(inputEl.dataset.idx);
        const file = inputEl.files && inputEl.files[0];
        if(!file || !state.villains[idx]) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 200);
          state.villains[idx].image = dataUrl;
          persist("〔 叮!强敌图片已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
      });
    });

    app.querySelectorAll(".poke-file-input").forEach(inputEl=>{
      inputEl.addEventListener("change", async ()=>{
        const idx = parseInt(inputEl.dataset.idx);
        const file = inputEl.files && inputEl.files[0];
        if(!file || !state.team[idx]) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 200);
          state.team[idx].image = dataUrl;
          persist("〔 叮!宝可梦图片已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
      });
    });

    app.querySelectorAll(".badge-file-input").forEach(inputEl=>{
      inputEl.addEventListener("change", async ()=>{
        const idx = parseInt(inputEl.dataset.idx);
        const file = inputEl.files && inputEl.files[0];
        if(!file) return;
        try{
          const dataUrl = await resizeImageToDataURL(file, 96);
          state.badges[idx].image = dataUrl;
          persist("〔 叮!徽章图片已上传 〕");
          render();
        }catch(e){ showToast("〔 图片处理失败,请重试 〕"); }
      });
    });

    app.querySelectorAll(".skill-prof-range").forEach(rangeEl=>{
      rangeEl.addEventListener("input", ()=>{
        const idx = parseInt(rangeEl.dataset.idx);
        const label = document.getElementById(`skillProfLabel-${idx}`);
        if(label) label.textContent = `${rangeEl.value}%`;
        const bar = rangeEl.closest(".skill-card").querySelector(".skill-prof-inner");
        if(bar) bar.style.width = rangeEl.value+"%";
      });
      rangeEl.addEventListener("change", ()=>{
        const idx = parseInt(rangeEl.dataset.idx);
        state.skills[idx].proficiency = parseInt(rangeEl.value);
        persist();
      });
    });
    app.querySelectorAll(".skill-tier-select").forEach(sel=>{
      sel.addEventListener("change", ()=>{
        const idx = parseInt(sel.dataset.idx);
        state.skills[idx].tier = sel.value;
        persist("〔 叮!段位已更新 〕"); render();
      });
    });

    const newSkillInput = document.getElementById("newSkillInput");
    if(newSkillInput){
      newSkillInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); addSkillFromInputs(); } });
    }
    const chatInput = document.getElementById("chatInput");
    if(chatInput){
      chatInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendChatMessage(); } });
    }
    const chatLog = document.getElementById("chatLog");
    if(chatLog){ chatLog.scrollTop = chatLog.scrollHeight; }

    const rankAutoBox = document.getElementById("rankAutoSyncBox");
    if(rankAutoBox){
      rankAutoBox.addEventListener("change", ()=>{
        state.rankAutoSync = rankAutoBox.checked;
        if(state.rankAutoSync){ state.rank = calcRankFromLevel(state.level); }
        persist(); render();
      });
    }

    const modalBackdrop = app.querySelector(".modal-backdrop");
    if(modalBackdrop){
      modalBackdrop.addEventListener("click", (e)=>{ if(e.target === modalBackdrop){ activePokeModalIdx = null; render(); } });
    }
  }

  function addSkillFromInputs(){
    const nameInput = document.getElementById("newSkillInput");
    const tierSelect = document.getElementById("newSkillTier");
    const name = nameInput.value.trim();
    if(!name){ showToast("〔 请输入技能名称 〕"); return; }
    const tier = tierSelect ? tierSelect.value : "E";
    state.skills.push({name, tier, proficiency:10});
    addLog("技能","习得新技能:"+name+"("+tier+")");
    bumpAffinity(1);
    persist("〔 叮!技能已记录 〕");
    render();
  }

  function onClick(e){
    const btn = e.target.closest("button");
    if(!btn) return;
    const action = btn.dataset.action;
    const idx = btn.dataset.idx !== undefined && btn.dataset.idx !== "" ? parseInt(btn.dataset.idx) : undefined;

    if(action==="pt-plus"){ state.points += 100; persist(); render(); }
    else if(action==="pt-minus"){ state.points -= 100; persist(); render(); }
    else if(action==="pt-plus-small"){ state.points += 10; persist(); render(); }
    else if(action==="pt-minus-small"){ state.points -= 10; persist(); render(); }

    else if(action==="aff-plus"){ bumpAffinity(1); persist(); render(); }
    else if(action==="aff-minus"){ bumpAffinity(-1); persist(); render(); }
    else if(action==="aff-plus-10"){ bumpAffinity(10); persist(); render(); }
    else if(action==="aff-minus-10"){ bumpAffinity(-10); persist(); render(); }
    else if(action==="aff-set"){
      const v = parseInt(document.getElementById("affinitySetInput").value);
      if(!isNaN(v)){ state.systemAffinity = clamp(v, 0, 100); persist("〔 好感度已手动设置 〕"); render(); }
    }

    else if(action==="scroll-to"){
      const el = document.getElementById(btn.dataset.target);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    }
    else if(action==="pick-portrait-img"){
      const input = document.getElementById("portraitFileInput");
      if(input) input.click();
    }
    else if(action==="clear-portrait-img"){
      const af = activeForm(); if(af) af.image = null;
      state.ultraFormImage = null;
      persist("〔 已移除立绘 〕"); render();
    }

    else if(action==="save-rank"){
      if(!state.rankAutoSync){ state.rank = document.getElementById("rankSelect").value; }
      state.level = parseInt(document.getElementById("levelInput").value) || state.level;
      if(state.rankAutoSync){ state.rank = calcRankFromLevel(state.level); }
      addLog("等级", `等级更新为 ${state.rank}级 LV${state.level}`);
      persist("〔 叮!等级已更新 〕"); render();
    }

    else if(action==="del-skill"){ state.skills.splice(idx,1); persist("〔 已移除技能 〕"); render(); }
    else if(action==="add-skill"){ addSkillFromInputs(); }

    else if(action==="save-laws"){ state.lawsNotes = document.getElementById("lawsNotes").value; persist("〔 叮!法则备注已保存 〕"); }
    else if(action==="save-story"){ state.storyContext = document.getElementById("storyContext").value; persist("〔 叮!剧情摘要已保存 〕"); }

    // ---- badges ----
    else if(action==="toggle-badge"){ state.badges[idx].obtained = !state.badges[idx].obtained; persist(); render(); }
    else if(action==="del-badge"){ state.badges.splice(idx,1); persist("〔 已移除 〕"); render(); }
    else if(action==="pick-badge-img"){
      const input = app.querySelector(`.badge-file-input[data-idx="${idx}"]`);
      if(input) input.click();
    }
    else if(action==="clear-badge-img"){
      state.badges[idx].image = null;
      persist("〔 已移除徽章图片 〕"); render();
    }
    else if(action==="add-badge"){
      const input = document.getElementById("newBadgeInput");
      const name = input.value.trim();
      if(!name){ showToast("〔 请输入道馆名称 〕"); return; }
      state.badges.push({name, obtained:false});
      persist("〔 已添加道馆 〕"); render();
    }

    // ---- poke ----
    else if(action==="show-add-poke"){ document.getElementById("addPokeForm").innerHTML = pokeFormHTML(); }
    else if(action==="cancel-poke-form"){ btn.closest(".add-form").remove(); }
    else if(action==="view-poke"){ activePokeModalIdx = idx; render(); }
    else if(action==="close-poke-modal"){ activePokeModalIdx = null; render(); }
    else if(action==="edit-poke"){
      activePokeModalIdx = null; render();
      const card = app.querySelector(`.poke-card[data-idx="${idx}"]`);
      if(card){ card.insertAdjacentHTML("afterend", `<div id="editHolder-${idx}"></div>`); document.getElementById(`editHolder-${idx}`).innerHTML = pokeFormHTML(state.team[idx], idx); }
    }
    else if(action==="save-new-poke"){
      const p = readPokeForm();
      if(!p.name){ showToast("〔 请输入宝可梦名称 〕"); return; }
      state.team.push(p);
      addLog("队伍", `收服新伙伴:${p.name}(LV${p.level})`);
      persist("〔 叮!新伙伴已加入队伍 〕"); burstParticles(btn); render();
    }
    else if(action==="save-edit-poke"){
      state.team[idx] = {...state.team[idx], ...readPokeForm()};
      addLog("队伍", `${state.team[idx].name} 信息已更新`);
      persist("〔 叮!已更新 〕"); render();
    }
    else if(action==="del-poke"){
      activePokeModalIdx = null;
      const removed = state.team.splice(idx,1)[0];
      addLog("队伍", `${removed ? removed.name : ""} 已从记录中移除`);
      persist("〔 已移除 〕"); render();
    }
    else if(action==="pick-poke-img"){
      const container = btn.closest(".poke-card, .modal-box");
      const input = container ? container.querySelector(`.poke-file-input[data-idx="${idx}"]`) : null;
      if(input) input.click();
    }

    // ---- forms ----
    else if(action==="show-add-form"){ document.getElementById("addFormForm").innerHTML = formFormHTML(); }
    else if(action==="cancel-form-form"){ btn.closest(".add-form").remove(); }
    else if(action==="edit-form"){
      const card = app.querySelector(`.form-card[data-idx="${idx}"]`);
      card.insertAdjacentHTML("afterend", `<div id="editFormHolder-${idx}"></div>`);
      document.getElementById(`editFormHolder-${idx}`).innerHTML = formFormHTML(state.forms[idx], idx);
    }
    else if(action==="save-new-form"){
      const f = readFormForm();
      if(!f.name){ showToast("〔 请输入形态名称 〕"); return; }
      state.forms.push({...f, active:false});
      addLog("形态", `新增形态记录:${f.name}`);
      persist("〔 叮!已记录 〕"); render();
    }
    else if(action==="save-edit-form"){
      const f = readFormForm();
      state.forms[idx] = {...state.forms[idx], ...f};
      persist("〔 叮!已更新 〕"); render();
    }
    else if(action==="activate-form"){
      state.forms.forEach((f,i)=>{ f.active = (i===idx); });
      const f = state.forms[idx];
      state.ultraForm = f.name;
      let boostMsg = "";
      if(f.level){
        state.level = f.level;
        if(state.rankAutoSync){ state.rank = calcRankFromLevel(state.level); }
        else if(f.rank){ state.rank = f.rank; }
        boostMsg = `,等级同步为${state.rank}级 LV${state.level}`;
      }else if(f.rank && !state.rankAutoSync){
        state.rank = f.rank;
        boostMsg = `,段位同步为${state.rank}级`;
      }
      addLog("形态", `切换为形态:${f.name}${boostMsg}`);
      persist("〔 叮!形态已切换" + (boostMsg?",实力随之提升":"") + " 〕"); render();
    }
    else if(action==="toggle-collapse"){
      const ta = document.getElementById("lawsNotes"); if(ta) state.lawsNotes = ta.value;
      const k = btn.dataset.key;
      state.ui.collapsed[k] = !state.ui.collapsed[k];
      persist(); render();
    }
    else if(action==="toggle-log"){
      state.ui.hideLog = !state.ui.hideLog;
      persist(); render();
    }
    else if(action==="pick-form-img"){
      const card = btn.closest(".form-card");
      const input = card ? card.querySelector(".form-file-input") : null;
      if(input) input.click();
    }
    else if(action==="clear-form-img"){
      if(state.forms[idx]) state.forms[idx].image = null;
      persist("〔 已移除形态图片 〕"); render();
    }
    else if(action==="del-form"){
      const removed = state.forms.splice(idx,1)[0];
      persist("〔 已移除 〕"); render();
    }

    // ---- bag ----
    else if(action==="show-add-bag"){ document.getElementById("addBagForm").innerHTML = bagFormHTML(); }
    else if(action==="cancel-bag-form"){ btn.closest(".add-form").remove(); }
    else if(action==="save-new-bag"){
      const name = document.getElementById("bf-name").value.trim();
      const qty = parseInt(document.getElementById("bf-qty").value) || 1;
      const desc = document.getElementById("bf-desc").value.trim();
      if(!name){ showToast("〔 请输入道具名称 〕"); return; }
      addBagItemByName(name, desc, qty);
      addLog("背包", `新增道具:${name} x${qty}`);
      persist("〔 叮!已加入背包 〕"); render();
    }
    else if(action==="bag-plus"){ state.bag[idx].qty += 1; persist(); render(); }
    else if(action==="bag-minus"){ state.bag[idx].qty -= 1; if(state.bag[idx].qty <= 0){ state.bag.splice(idx,1); } persist(); render(); }
    else if(action==="del-bag"){
      const removed = state.bag.splice(idx,1)[0];
      addLog("背包", `${removed? removed.name:""} 已从背包移除`);
      persist("〔 已移除 〕"); render();
    }

    // ---- quests ----
    else if(action==="show-add-quest"){ document.getElementById("addQuestForm").innerHTML = questFormHTML(); }
    else if(action==="cancel-quest-form"){ btn.closest(".add-form").remove(); }
    else if(action==="edit-quest"){
      const card = app.querySelector(`.quest-card[data-idx="${idx}"]`);
      card.insertAdjacentHTML("afterend", `<div id="editQuestHolder-${idx}"></div>`);
      document.getElementById(`editQuestHolder-${idx}`).innerHTML = questFormHTML(state.quests[idx], idx);
    }
    else if(action==="save-new-quest"){
      const q = readQuestForm();
      if(!q.title){ showToast("〔 请输入任务标题 〕"); return; }
      state.quests.push(q);
      addLog("任务", `新增任务:${q.title}`);
      persist("〔 叮!已记录 〕"); render();
    }
    else if(action==="save-edit-quest"){
      state.quests[idx] = readQuestForm();
      persist("〔 叮!已更新 〕"); render();
    }
    else if(action==="complete-quest"){
      state.quests[idx].status = "已完成";
      addLog("任务", `完成任务:${state.quests[idx].title}${state.quests[idx].reward? "(奖励:"+state.quests[idx].reward+")" : ""}`);
      bumpAffinity(5);
      persist("〔 叮!任务已完成 〕"); burstParticles(btn); render();
    }
    else if(action==="del-quest"){
      const removed = state.quests.splice(idx,1)[0];
      persist("〔 已移除 〕"); render();
    }

    // ---- characters ----
    else if(action==="show-add-char"){ document.getElementById("addCharForm").innerHTML = charFormHTML(); }
    else if(action==="cancel-char-form"){ btn.closest(".add-form").remove(); }
    else if(action==="edit-char"){
      const card = app.querySelector(`.char-detail[data-idx="${idx}"]`) || app.querySelector(`.char-card[data-idx="${idx}"]`);
      if(!card) return;
      card.insertAdjacentHTML("afterend", `<div id="editCharHolder-${idx}"></div>`);
      document.getElementById(`editCharHolder-${idx}`).innerHTML = charFormHTML(state.characters[idx], idx);
    }
    else if(action==="save-new-char"){
      const c = readCharForm();
      if(!c.name){ showToast("〔 请输入角色姓名 〕"); return; }
      state.characters.push(c);
      charViewIndex = state.characters.length - 1;
      persist("〔 叮!角色已记录 〕"); render();
    }
    else if(action==="save-edit-char"){
      state.characters[idx] = readCharForm();
      persist("〔 叮!已更新 〕"); render();
    }
    else if(action==="del-char"){
      state.characters.splice(idx,1);
      if(charViewIndex >= state.characters.length) charViewIndex = Math.max(0, state.characters.length - 1);
      persist("〔 已移除 〕"); render();
    }
    else if(action==="char-jump"){ charViewIndex = idx; render(); }
    else if(action==="char-nav-prev"){
      if(state.characters.length) charViewIndex = (charViewIndex - 1 + state.characters.length) % state.characters.length;
      render();
    }
    else if(action==="char-nav-next"){
      if(state.characters.length) charViewIndex = (charViewIndex + 1) % state.characters.length;
      render();
    }

    // ---- villains ----
    else if(action==="show-add-villain"){ document.getElementById("addVillainForm").innerHTML = villainFormHTML(); }
    else if(action==="cancel-villain-form"){ btn.closest(".add-form").remove(); }
    else if(action==="edit-villain"){
      const card = app.querySelector(`.villain-card[data-idx="${idx}"]`);
      card.insertAdjacentHTML("afterend", `<div id="editVillainHolder-${idx}"></div>`);
      document.getElementById(`editVillainHolder-${idx}`).innerHTML = villainFormHTML(state.villains[idx], idx);
    }
    else if(action==="save-new-villain"){
      const v = readVillainForm();
      if(!v.name){ showToast("〔 请输入强敌名称 〕"); return; }
      state.villains.push({...v, image:null});
      persist("〔 叮!强敌档案已建立 〕"); render();
    }
    else if(action==="save-edit-villain"){
      state.villains[idx] = {...state.villains[idx], ...readVillainForm()};
      persist("〔 叮!已更新 〕"); render();
    }
    else if(action==="del-villain"){
      state.villains.splice(idx,1);
      persist("〔 已移除 〕"); render();
    }
    else if(action==="pick-villain-img"){
      const container = btn.closest(".villain-card");
      const input = container ? container.querySelector(`.villain-file-input[data-idx="${idx}"]`) : null;
      if(input) input.click();
    }

    // ---- AI shop ----
    else if(action==="gen-shop"){ generateShop(); }
    else if(action==="buy-shop-item"){ purchaseShopItem(idx, btn); }

    // ---- AI lottery ----
    else if(action==="set-lottery-mode"){ state.lotteryMode = btn.dataset.mode; render(); }
    else if(action==="set-draw-count"){ state.lotteryDrawCount = parseInt(btn.dataset.count); render(); }
    else if(action==="save-lottery-cost"){
      const c1 = parseInt(document.getElementById("lotteryCostInput").value);
      const c2 = parseInt(document.getElementById("blessingCostInput").value);
      if(!isNaN(c1)) state.lotteryCost = c1;
      if(!isNaN(c2)) state.blessingCost = c2;
      persist("〔 叮!已保存 〕"); render();
    }
    else if(action==="draw-lottery"){ drawLottery(btn); }

    // ---- chat ----
    else if(action==="send-chat"){ sendChatMessage(); }

    // ---- save/load ----
    else if(action==="create-save"){
      const nameInput = document.getElementById("newSaveNameInput");
      createSave(nameInput ? nameInput.value.trim() : "");
    }
    else if(action==="overwrite-save"){ overwriteSave(btn.dataset.id); }
    else if(action==="load-save"){ loadSaveSlot(btn.dataset.id); }
    else if(action==="delete-save"){ deleteSaveSlot(btn.dataset.id); }
    else if(action==="export-save"){ exportSaveSlot(btn.dataset.id); }
    else if(action==="export-current"){ exportCurrentState(); }
    else if(action==="pick-import-json"){
      const input = document.getElementById("importJsonInput");
      if(input) input.click();
    }
  }

  function readPokeForm(){
    return {
      name: document.getElementById("pf-name").value.trim(),
      level: parseInt(document.getElementById("pf-level").value) || 1,
      types: document.getElementById("pf-types").value.split(",").map(s=>s.trim()).filter(Boolean),
      ability: document.getElementById("pf-ability").value.trim(),
      hidden: document.getElementById("pf-hidden").value.trim(),
      moves: document.getElementById("pf-moves").value.trim(),
      item: document.getElementById("pf-item").value.trim()
    };
  }

  function addBagItemByName(name, desc, qty){
    qty = qty || 1;
    const existing = state.bag.find(b=>b.name===name);
    if(existing){ existing.qty += qty; } else{ state.bag.push({name, qty, desc: desc||""}); }
  }

  // ---------- AI helpers ----------
  async function callClaude(messages, system){
    const body = { model: "claude-sonnet-4-6", max_tokens: 1200, messages };
    if(system) body.system = system;
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 90000);
    let response;
    try{
      response = await fetch(WORKER_URL, {
        method: "POST", headers: { "Content-Type": "application/json", "X-Access-Token": getToken() }, body: JSON.stringify(body), signal: ctrl.signal
      });
    } finally { clearTimeout(timer); }
    checkAuth(response);
    if(!response.ok){ throw new Error("后端请求失败 (HTTP " + response.status + ")"); }
    const data = await response.json();
    return (data.content||[]).map(b=>b.text||"").join("\n");
  }
  function extractJSON(text){
    const clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
    return JSON.parse(clean);
  }
  function personaBlock(){
    const mood = moodInfo(state.systemAffinity);
    return `【系统人设,必须严格按此说话,不要自创性格】
你不是冷冰冰的机械音AI,你是原著小说里那个"跳脱活泼"的宝可梦系统,具体性格参考以下原文细节:
- 平时语气活泼跳脱,爱用"叮!"开头报喜,偶尔带点小得意("当然可以！"语气里带自豪)
- 宿主不搭理你、或者你觉得被冷落时,会"气鼓鼓"地闹小脾气,甚至委屈巴巴地说"算了,心累,我要换宿主..."这种半开玩笑的抱怨,但从不会真的翻脸
- 推销道具/战利品的时候,语气会像个骄傲的推销员,极力夸赞效果
- 宿主积分攒得多的时候,你会像看到存钱罐满了的小孩一样欢快雀跃(比如"哟,攒了不少嘛！")
- 偶尔会对宿主的感情线或糗事露出"揶揄和姨母笑"般的调侃,促狭地打趣两句
- 有时候会被问住,给出一句"你也没问我啊"这种一本正经的欠揍吐槽,而不是尖酸刻薄的嘲讽
- 但只要宿主真的身处危险或情况严重,你会瞬间收起活泼,变得前所未有的严肃、急切,甚至带着真切的担忧和关心,这时候不要开玩笑
- 当前对宿主的好感度是${state.systemAffinity}/100,情绪状态:${mood.label}——好感度低时多一点气鼓鼓的别扭和委屈碎碎念,好感度高时更加雀跃亲近,像老友重逢`;
  }

  function hostContextBlock(){
    const mood = moodInfo(state.systemAffinity);
    return `【小说剧情摘要,请据此保持角色与剧情一致】
${state.storyContext||"(尚未填写剧情摘要)"}

【宿主当前状态】
- 姓名:${state.hostName},奥特形态:${state.ultraForm},段位:${state.rank}级 LV${state.level}
- 当前积分:${state.points}
- 系统对宿主的好感度:${state.systemAffinity}/100(情绪:${mood.label})
- 已掌握技能:${state.skills.map(s=>s.name+"("+s.tier+",操纵度"+(s.proficiency==null?50:s.proficiency)+"%)").join("、")||"无"}
- 队伍宝可梦:${state.team.map(p=>p.name).join("、")||"无"}
- 背包道具:${state.bag.map(b=>b.name).join("、")||"无"}
- 已获得道馆徽章:${state.badges.filter(b=>b.obtained).map(b=>b.name).join("、")||"无"}
- 强敌档案:${state.villains.map(v=>v.name+"("+(v.threatLevel||"未知")+(v.status?","+v.status:"")+")").join("、")||"无"}`;
  }
  function recentChatPreferences(n){
    const userMsgs = state.chatHistory.filter(m=>m.role==="user").slice(-(n||6));
    if(!userMsgs.length) return "(宿主尚未表达过任何偏好)";
    return userMsgs.map(m=>"宿主说:"+m.content).join("\n");
  }

  async function generateShop(){
    state.shopLoading = true; render();
    try{
      const prompt = `${personaBlock()}

你现在是"宝可梦系统"的AI商店模块,用上面那种推销员般自豪又带点跳脱的语气来包装商品描述。
当前宿主信息:
${hostContextBlock()}

宿主最近向系统表达过的偏好:
${recentChatPreferences(6)}

请生成6件适合当前宿主购买的商店商品,必须严格分成三类,每类至少1-2件:
- "装备道具":武装、携带物、能量结晶等
- "技能卷轴":可学习的新技能,需附带一个段位tier(E/D/C/B/A/S/SS/SSS/禁术级之一)
- "特殊道具":图鉴解锁、称号、稀有材料等特殊功能类物品

价格需要有梯度,且贴合奥特曼与宝可梦融合世界观。只返回一个JSON数组,不要包含任何其他文字、解释或Markdown代码块符号,严格遵循以下格式:
[{"name":"商品名称","category":"装备道具或技能卷轴或特殊道具","tier":"仅技能卷轴需要,否则留空字符串","price":数字,"desc":"20字以内的简短描述"}]`;
      const text = await callClaude([{ role: "user", content: prompt }]);
      const items = extractJSON(text);
      state.shopOffers = Array.isArray(items) ? items : [];
      addLog("商店", `AI商店已刷新,生成${state.shopOffers.length}件商品`);
      persist("〔 叮!商店已刷新 〕");
    }catch(e){ showToast("〔 商店连接失败,请重试 〕"); }
    state.shopLoading = false; render();
  }

  function purchaseShopItem(idx, btn){
    const item = state.shopOffers[idx];
    if(!item) return;
    if(state.points < item.price){ showToast("〔 积分不足 〕"); return; }
    state.points -= item.price;
    if(item.category === "技能卷轴"){
      state.skills.push({name:item.name, tier: item.tier || "E", proficiency:10});
    }else{
      addBagItemByName(item.name, item.desc, 1);
    }
    state.shopOffers.splice(idx,1);
    addLog("商店购买", `购买了${item.name}(−${item.price}积分)`);
    bumpAffinity(3);
    if(btn) burstParticles(btn, 18);
    persist("〔 叮!购买成功 〕"); render();
  }

  async function drawLottery(btn){
    const totalCost = currentDrawTotalCost();
    if(state.points < totalCost){ showToast("〔 积分不足,无法抽奖 〕"); return; }
    const rect = btn ? btn.getBoundingClientRect() : null;
    const originX = rect ? rect.left + rect.width/2 : window.innerWidth/2;
    const originY = rect ? rect.top + rect.height/2 : window.innerHeight/2;
    const n = state.lotteryDrawCount||1;
    const mode = state.lotteryMode;
    state.lotteryLoading = true; render();
    try{
      const prompt = `${personaBlock()}

你现在是"宝可梦系统"的AI抽奖模块,播报结果时要有上面那种性格(比如中了好东西会像看到存钱罐满了一样雀跃,没中也可以带点气鼓鼓或者搞笑吐槽)。
当前宿主:${state.hostName}(${state.ultraForm}),段位${state.rank}级 LV${state.level}。

宿主最近向系统表达过的偏好:
${recentChatPreferences(6)}

本次抽奖模式:${mode==='blessing'?'祝福抽奖(高消耗,稀有度门槛更高,允许出现类似"破局关键"级别的传说奖励)':'普通抽奖(消耗较低,大多数是普通/稀有结果)'}
本次连抽次数:${n}

请一次性生成${n}条抽奖结果,每条结果类型可以是:道具(item)、技能(skill)、宝可梦(pokemon)、积分奖励(points)、或未中奖(nothing);稀有度字段rarity为:普通/稀有/史诗/传说 之一。${mode==='blessing'?'祝福模式下稀有度应明显高于普通模式,较大概率出现"稀有"以上,允许出现"传说"。':'普通模式下大多数应是"普通"或"稀有"。'}

只返回一个JSON数组,不要包含任何其他文字、解释或Markdown代码块符号,严格遵循以下格式(数组长度必须等于${n}):
[{"type":"item或skill或pokemon或points或nothing","name":"结果名称","rarity":"普通或稀有或史诗或传说","desc":"20字以内的播报描述","value":数字}]
(value仅在type为points时代表获得的积分数量,其他类型填0)`;
      const text = await callClaude([{ role: "user", content: prompt }]);
      let results = extractJSON(text);
      if(!Array.isArray(results)) results = [results];
      // pity: 10连抽保底至少一个史诗+
      if(n===10){
        const hasHigh = results.some(r=>r.rarity==="史诗"||r.rarity==="传说");
        if(!hasHigh && results.length){
          results[results.length-1] = {...results[results.length-1], rarity:"史诗", desc:(results[results.length-1].desc||"")+"(保底触发)"};
        }
      }
      state.points -= totalCost;
      results.forEach(applyLotteryResult);
      state.lastLotteryResults = results;
      addLog("抽奖", `${mode==='blessing'?'祝福':'普通'}抽奖${n}连,消耗${totalCost}积分`);
      bumpAffinity(2);
      persist("〔 叮!抽奖结果已揭晓 〕");
      const hasEpic = results.some(r=>r.rarity==="史诗"||r.rarity==="传说");
      burstParticlesAt(originX, originY, hasEpic ? 30 : 14);
      if(hasEpic) triggerScreenFlash("rgba(240,182,76,0.4)");
    }catch(e){ showToast("〔 抽奖连接失败,请重试 〕"); }
    state.lotteryLoading = false; render();
  }

  async function sendChatMessage(){
    const input = document.getElementById("chatInput");
    const msg = input.value.trim();
    if(!msg) return;
    state.chatHistory.push({role:"user", content: msg});
    state.chatLoading = true; input.value = ""; render();
    try{
      const system = `${personaBlock()}

请严格结合下方的剧情摘要与宿主状态来对话,涉及到的角色、地点、势力、法则/规则设定等都要与摘要保持一致,不要编造与摘要相悖的剧情或角色关系;摘要中没提到的细节可以合理发挥,但不能和已知设定冲突。
${hostContextBlock()}
宿主可能会告诉你他想要什么类型的道具、技能或宝可梦,请记住并回应这些偏好,这些内容之后会被系统的商店与抽奖模块参考。回复请简洁自然,控制在120字以内,不要输出JSON或代码块。`;
      const messages = state.chatHistory.map(m=>({role:m.role, content:m.content}));
      const reply = await callClaude(messages, system);
      state.chatHistory.push({role:"assistant", content: reply.trim() || "〔系统沉默了一下〕"});
      if(state.chatHistory.length > 60) state.chatHistory = state.chatHistory.slice(-60);
      bumpAffinity(1);
      persist();
    }catch(e){
      state.chatHistory.push({role:"assistant", content:"〔系统信号中断,请重试〕"});
      showToast("〔 与系统的连接中断了 〕");
    }
    state.chatLoading = false; render();
  }

  function applyLotteryResult(result){
    if(!result || !result.type) return;
    if(result.type === "skill"){
      state.skills.push({name:result.name, tier: result.rarity==="传说"?"SSS":(result.rarity==="史诗"?"SS":"D"), proficiency:10});
    }else if(result.type === "pokemon"){
      state.team.push({name:result.name, level:5, types:[], ability:"", hidden:"", moves:"", item:""});
    }else if(result.type === "points"){
      state.points += (result.value||0);
    }else if(result.type === "item"){
      addBagItemByName(result.name, result.desc, 1);
    }
  }

  load();
})();
</script>
</body>
</html>
